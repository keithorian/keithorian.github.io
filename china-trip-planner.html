/* ---------- pointer drag & drop (mouse + touch + pen) ---------- */
let drag=null, pending=null, dragJustEnded=false, raf=0;
board.addEventListener("pointerdown",e=>{
  if(e.button>0) return;
  const card=e.target.closest(".card"); if(!card||e.target.closest("a,.cnav,.cpick")) return;
  const onHandle=!!e.target.closest(".handle");
  pending={card,id:card.dataset.id,x:e.clientX,y:e.clientY,pid:e.pointerId,type:e.pointerType,onHandle,timer:0};
  if(e.pointerType!=="mouse"&&!onHandle){
    pending.timer=setTimeout(()=>{ if(pending){ if(navigator.vibrate) try{navigator.vibrate(15)}catch(_){} startDrag(pending.x,pending.y); } },380);
  }
  if(onHandle) e.preventDefault();
});
window.addEventListener("pointermove",e=>{
  if(drag){ if(e.pointerId!==drag.pid) return; e.preventDefault(); drag.x=e.clientX; drag.y=e.clientY; positionGhost(); hitTest(); return; }
  if(!pending||e.pointerId!==pending.pid) return;
  const dist=Math.hypot(e.clientX-pending.x,e.clientY-pending.y);
  if(pending.type==="mouse"||pending.onHandle){ if(dist>4) startDrag(e.clientX,e.clientY); }
  else if(dist>10){ clearTimeout(pending.timer); pending=null; }
  if(pending){pending.x=e.clientX;pending.y=e.clientY;}
},{passive:false});
document.addEventListener("touchmove",e=>{ if(drag) e.preventDefault(); },{passive:false});
document.addEventListener("contextmenu",e=>{ if(drag||(pending&&pending.type!=="mouse")) e.preventDefault(); });
window.addEventListener("pointerup",e=>endPointer(e,false));
window.addEventListener("pointercancel",e=>endPointer(e,true));
function endPointer(e,cancel){
  if(pending){ clearTimeout(pending.timer); pending=null; }
  if(!drag||e.pointerId!==drag.pid) return;
  finishDrag(cancel);
}
function startDrag(x,y){
  const p=pending; pending=null; clearTimeout(p.timer);
  const card=p.card, r=card.getBoundingClientRect();
  const ghost=card.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width=r.width+"px"; ghost.removeAttribute("data-id");
  document.body.appendChild(ghost);
  card.classList.add("dragging-src"); document.body.classList.add("dragging");
  drag={id:p.id,card,ghost,pid:p.pid,x,y,offX:x-r.left,offY:y-r.top,fromLid:card.parentElement.dataset.lid,fromIdx:[...card.parentElement.children].indexOf(card)};
  positionGhost(); raf=requestAnimationFrame(autoScroll);
}
function positionGhost(){ drag.ghost.style.left=(drag.x-drag.offX)+"px"; drag.ghost.style.top=(drag.y-drag.offY)+"px"; }
function hitTest(){
  const el=document.elementFromPoint(drag.x,drag.y); if(!el) return;
  let list=el.closest(".list");
  if(!list){ const day=el.closest(".day"); if(day) list=day.querySelector(".list"); }
  if(!list) return;
  document.querySelectorAll(".list.over").forEach(l=>l!==list&&l.classList.remove("over")); list.classList.add("over");
  const siblings=[...list.children].filter(c=>c!==drag.card);
  let before=null;
  for(const c of siblings){ const r=c.getBoundingClientRect(); if(drag.y<r.top+r.height/2){before=c;break;} }
  if(before){ if(drag.card.nextElementSibling!==before||drag.card.parentElement!==list) list.insertBefore(drag.card,before); }
  else if(list.lastElementChild!==drag.card) list.appendChild(drag.card);
}
function autoScroll(){
  if(!drag) return;
  const edge=60, vh=window.innerHeight, vw=window.innerWidth, sp=(d)=>Math.ceil((edge-d)/edge*18);
  const hdr=Math.max(0,document.querySelector(".jump").getBoundingClientRect().bottom);
  let moved=false;
  if(drag.y<hdr+edge&&window.scrollY>0){ window.scrollBy(0,-sp(drag.y-hdr)); moved=true; }
  else if(drag.y>vh-edge){ window.scrollBy(0,sp(vh-drag.y)); moved=true; }
  if(board.scrollWidth>board.clientWidth){
    if(drag.x<edge){ board.scrollLeft-=sp(drag.x); moved=true; } else if(drag.x>vw-edge){ board.scrollLeft+=sp(vw-drag.x); moved=true; }
  }
  if(moved) hitTest();
  raf=requestAnimationFrame(autoScroll);
}
function finishDrag(cancel){
  cancelAnimationFrame(raf);
  const d=drag; drag=null;
  d.ghost.remove(); d.card.classList.remove("dragging-src"); document.body.classList.remove("dragging");
  document.querySelectorAll(".list.over").forEach(l=>l.classList.remove("over"));
  dragJustEnded=true; setTimeout(()=>dragJustEnded=false,50);
  const list=d.card.parentElement; const toLid=list&&list.dataset.lid; const toIdx=list?[...list.children].indexOf(d.card):-1;
  if(cancel||!toLid||(toLid===d.fromLid&&toIdx===d.fromIdx)){ render(); return; }
  snapshot(); moveItem(d.id,toLid,toIdx); { const g=findItem(d.id); if(g) logAct(toLid==="ideas"&&d.fromLid!=="ideas"?"maybe":"move",g.item,toLid); } commit();
  if(toLid!==d.fromLid) toast(T("tMoved")(dayLabel(toLid)),true);
}

const b64u={enc:bytes=>{let s="";for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");},
  dec:str=>{str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u;}};
async function streamBytes(bytes,ts){ const s=new Blob([bytes]).stream().pipeThrough(ts); return new Uint8Array(await new Response(s).arrayBuffer()); }
const shareable=()=>{const p=clone(plan); delete p.savedAt; return p;};
async function encodePlan(p){
  const bytes=new TextEncoder().encode(JSON.stringify(p));
  if(typeof CompressionStream==="function"){ try{ return "z="+b64u.enc(await streamBytes(bytes,new CompressionStream("deflate-raw"))); }catch(e){} }
  return "j="+b64u.enc(bytes);
}
async function decodePlan(hash){
  const m=String(hash).replace(/^.*#/,"").match(/(?:^|&)([zj])=([A-Za-z0-9_-]+)/); if(!m) return null;
  let bytes=b64u.dec(m[2]);
  if(m[1]==="z"){ if(typeof DecompressionStream!=="function") throw new Error(T("tNoDecomp")); bytes=await streamBytes(bytes,new DecompressionStream("deflate-raw")); }
  return normalize(JSON.parse(new TextDecoder().decode(bytes)));
}
async function shareLink(){ return location.href.split("#")[0]+"#"+await encodePlan(shareable()); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  let ok=false; try{ok=document.execCommand("copy");}catch(e){} ta.remove(); return ok;
}

function fileName(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return `china-trip-plan-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; }

/* ---------- co-planning: picks (❤️ / ⭐), changelog, "what changed" banner, Maybe list ----------
   Who am I: the chat identity if this phone set one (#me=keith|her), otherwise Thai view = her, English view = Keith. */
function whoAmI(){ try{ const v=localStorage.getItem("chinaTripPlanner.chatAs"); if(v==="keith"||v==="her") return v; }catch(e){} return lang==="th"?"her":"keith"; }
function pname(w){ if(w===whoAmI()&&lang==="th") return T("pYou"); return w==="keith"?T("pKeith"):w==="her"?T("pHer"):w==="bot"?T("pBot"):""; }
const itemSig=it=>JSON.stringify([it.time_en,it.time_th,it.title_en,it.title_th,it.notes_en,it.notes_th,it.link,it.cat,it.status,it.zh||"",it.zh_addr||""]);
function logAct(a,it,lid){
  if(!it) return;
  const e=logEntry({id:"l"+uid(),ts:Date.now(),by:whoAmI(),a,item:it.id,t:String(it.title_en||"").slice(0,80),th:String(it.title_th||"").slice(0,80),d:lid||""});
  if(!Array.isArray(plan.log)) plan.log=[];
  plan.log.push(e); if(plan.log.length>LOG_CAP) plan.log.splice(0,plan.log.length-LOG_CAP);
}
function pickBadges(it){
  const p=it.picks||{};
  const L=PICK_WHO.filter(w=>p[w]).map(w=>`<span class="pb pb-${w}">${esc(pname(w))} ${p[w].h?"❤️":""}${p[w].s?"⭐":""}</span>`);
  return L.length?`<span class="pbs" title="${esc(T("pickedBy"))}">${L.join("")}</span>`:"";
}
// place cards (the ones with Go 🚕) and every idea get the pick buttons
// picks go on every real activity (places, meals, rides, shows, walks, incl. nav:false in-park items) and every idea;
// not on logistics (travel legs, flights, trains, hotel check-in/out) or placeholders ("No plans", "free time")
const PICK_SKIP=/\b(no plans?|free (time|day|afternoon|morning|evening)|tbd|to be planned|return to|back to (the )?(hotel|apartment)|packing|check-?(in|out)|drop bags)\b|ว่าง|ยังไม่มีแผน|เช็คอิน|เช็คเอาต์|เช็กอิน|เช็กเอาต์/i;
function pickable(it){
  if(it.cat==="travel"||it.cat==="hotel") return false;
  return !PICK_SKIP.test(it.title_en||"")&&!PICK_SKIP.test(it.title_th||"");
}
function pickHTML(it,day,title,force,withBadges){
  if(!force&&day&&!pickable(it)) return "";
  const mp=(it.picks||{})[whoAmI()]||{};
  const b=(k,on,off,lbl,aria)=>`<button class="pk${mp[k]?" on":""}" type="button" data-pick="${k}" data-id="${esc(it.id)}" aria-pressed="${mp[k]?"true":"false"}" aria-label="${esc(T(aria)(title))}" title="${esc(T(lbl))}">${mp[k]?on:off}</button>`;
  return `<div class="cpick">${b("h","❤️","🤍","pickH","pickHA")}${b("s","⭐","☆","pickS","pickSA")}${withBadges?pickBadges(it):""}</div>`;
}
function togglePick(id,k){
  const f=findItem(id); if(!f||!/^[hs]$/.test(k)) return null;
  snapshot();
  const it=f.item, me=whoAmI(), p=clone(it.picks||{}), m=p[me]=Object.assign({},p[me]);
  const on=!m[k]; if(on) m[k]=1; else delete m[k];
  it.picks=p; navFields(Object.assign({},it),it); // canonical field order (sync compares plans as JSON)
  if(on) logAct(k==="h"?"heart":"star",it,f.lid);
  commit(); toast(on?T(k==="h"?"tHeart":"tStar"):T("tUnpick"));
  const b=document.querySelector(`#sheet [data-pick="${k}"][data-id="${id}"]`)||document.querySelector(`.card[data-id="${id}"] [data-pick="${k}"]`);
  if(b){ try{ b.focus({preventScroll:true}); }catch(e){} if(on&&b.animate) b.animate([{transform:"scale(1.4)"},{transform:"scale(1)"}],{duration:280,easing:"ease-out"}); }
  return on;
}

/* "What changed" banner: diffs the plan this phone last saw against the one it just received.
   Unseen changes stay (localStorage) until "Got it"; nothing on the very first visit. */
const Changes=(function(){
  const KEY="chinaTripPlanner.changes", MAX=5;
  let armed=false; try{ armed=!!localStorage.getItem(STORE_KEY); }catch(e){}
  let events=[]; try{ events=JSON.parse(localStorage.getItem(KEY)||"[]"); if(!Array.isArray(events)) events=[]; }catch(e){ events=[]; }
  const keep=()=>{ try{ events.length?localStorage.setItem(KEY,JSON.stringify(events)):localStorage.removeItem(KEY); }catch(e){} };
  const index=p=>{ const m=new Map(); p.days.forEach(d=>d.items.forEach((it,j)=>m.set(it.id,{it,lid:d.id,j}))); p.ideas.forEach((it,j)=>m.set(it.id,{it,lid:"ideas",j})); return m; };
  function note(prev,next,by){
    if(!prev||!next) return [];
    if(!armed){ armed=true; return []; } // first sync on a fresh phone: nothing to report
    const me=whoAmI(), A=index(prev), B=index(next);
    const old=new Set((prev.log||[]).map(x=>x.id)), fresh=(next.log||[]).filter(x=>!old.has(x.id));
    const fb=by==="keith-assistant"||by==="bot"?"bot":"";
    const whoFor=(id,acts)=>{ for(let i=fresh.length-1;i>=0;i--){ const x=fresh[i]; if(x.item===id&&(!acts||acts.includes(x.a))) return x.by; } return ""; };
    const by_=(id,acts)=>whoFor(id,acts)||whoFor(id)||fb;
    const ev=[], now=Date.now();
    const push=(who,a,it,lid)=>{ if(who&&who===me) return; ev.push({who,a,id:it.id,lid,t:String(it.title_en||"").slice(0,60),th:String(it.title_th||"").slice(0,60),ts:now}); };
    B.forEach((b,id)=>{ const a=A.get(id);
      if(!a){ push(by_(id,["add","idea"]),b.lid==="ideas"?"idea":"add",b.it,b.lid); return; }
      if(a.lid!==b.lid) push(by_(id,["move","maybe"]),b.lid==="ideas"?"maybe":"move",b.it,b.lid);
      else if(a.j!==b.j&&fresh.some(x=>x.item===id&&x.a==="move")) push(by_(id,["move"]),"move",b.it,b.lid);
      if(itemSig(a.it)!==itemSig(b.it)) push(by_(id,["edit"]),"edit",b.it,b.lid);
      PICK_WHO.forEach(w=>{ const pa=(a.it.picks||{})[w]||{}, pb=(b.it.picks||{})[w]||{};
        if(pb.h&&!pa.h) push(w,"heart",b.it,b.lid); if(pb.s&&!pa.s) push(w,"star",b.it,b.lid); });
    });
    A.forEach((a,id)=>{ if(!B.has(id)) push(by_(id,["del"]),"del",a.it,a.lid); });
    if(ev.length){ events=events.concat(ev).slice(-40); keep(); }
    return ev;
  }
  const PER_LID={add:1,move:1,edit:1,del:1};
  function lines(){
    const g=new Map();
    events.forEach(e=>{ const k=e.who+"|"+e.a+"|"+(PER_LID[e.a]?e.lid:""); let L=g.get(k); if(!L){ L={who:e.who,a:e.a,lid:e.lid,ids:[],ev:[]}; g.set(k,L); }
      if(!L.ids.includes(e.id)){ L.ids.push(e.id); L.ev.push(e); } });
    return [...g.values()];
  }
  const CH={
    en:{add:(n,t,d)=>n>1?`added ${n} things on ${d}`:`added “${t}” on ${d}`, idea:(n,t)=>n>1?`added ${n} ideas to Maybe`:`added “${t}” to Maybe`,
        move:(n,t,d)=>n>1?`moved ${n} things on ${d}`:`moved “${t}” to ${d}`, maybe:(n,t)=>n>1?`moved ${n} things back to Maybe`:`moved “${t}” back to Maybe`,
        edit:(n,t,d)=>n>1?`updated ${n} things on ${d}`:`updated “${t}” on ${d}`, del:(n,t,d)=>n>1?`removed ${n} things${d?` from ${d}`:""}`:`removed “${t}”${d?` from ${d}`:""}`,
        heart:(n,t)=>n>1?`loved ${n} things ❤️`:`loved “${t}” ❤️`, star:(n,t)=>n>1?`marked ${n} must-dos ⭐`:`marked “${t}” as a must-do ⭐`},
    th:{add:(n,t,d)=>n>1?`เพิ่ม ${n} อย่างใน${d}`:`เพิ่ม “${t}” ใน${d}`, idea:(n,t)=>n>1?`เพิ่ม ${n} ไอเดียลงลิสต์อาจจะไป`:`เพิ่ม “${t}” ลงลิสต์อาจจะไป`,
        move:(n,t,d)=>n>1?`ย้าย ${n} อย่างใน${d}`:`ย้าย “${t}” ไป${d}`, maybe:(n,t)=>n>1?`ย้าย ${n} อย่างกลับไปลิสต์อาจจะไป`:`ย้าย “${t}” กลับไปลิสต์อาจจะไป`,
        edit:(n,t,d)=>n>1?`แก้ ${n} อย่างใน${d}`:`แก้ “${t}” ใน${d}`, del:(n,t,d)=>n>1?`ลบ ${n} อย่าง${d?`จาก${d}`:""}`:`ลบ “${t}”${d?` จาก${d}`:""}`,
        heart:(n,t)=>n>1?`กดใจ ${n} อย่าง ❤️`:`กดใจ “${t}” ❤️`, star:(n,t)=>n>1?`ปักหมุดห้ามพลาด ${n} อย่าง ⭐`:`ปักหมุด “${t}” ว่าห้ามพลาด ⭐`}};
  const short=s=>{ s=String(s||""); return s.length>42?s.slice(0,40).trimEnd()+"…":s; };
  function text(L){
    const e=L.ev[L.ev.length-1], live=findItem(e.id);
    const t=short(live?tx(live.item,"title"):(lang==="th"?e.th||e.t:e.t||e.th));
    const di=plan.days.findIndex(d=>d.id===L.lid), d=di>=0?T("dayN")(di+1):"";
    const v=CH[lang][L.a]?CH[lang][L.a](L.ids.length,t,d):"";
    const who=L.who?pname(L.who):"";
    if(who) return who+" "+v;
    return lang==="en"?v.charAt(0).toUpperCase()+v.slice(1):v;
  }
  function paint(){
    const el=$("#changes"); if(!el) return;
    const all=lines(); if(!all.length){ el.hidden=true; el.innerHTML=""; return; }
    const show=all.slice(0,MAX), more=all.length-show.length;
    el.innerHTML=`<div class="chg" role="status"><div class="chgh"><b>✨ ${esc(T("chH"))}</b><button class="btn chgx" type="button" data-chg-x>${esc(T("chOk"))}</button></div>
      <ul>${show.map((L,i)=>`<li><button type="button" class="chgl" data-chg="${i}" title="${esc(T("chJump"))}"><span class="chgd" aria-hidden="true"></span>${esc(text(L))}<span class="chga" aria-hidden="true">›</span></button></li>`).join("")}</ul>
      ${more>0?`<div class="chgmore">${esc(T("chMore")(more))}</div>`:""}</div>`;
    el.hidden=false;
  }
  function spot(ids,lid){
    const live=ids.filter(id=>findItem(id));
    if(!live.length){ if(lid&&(lid==="ideas"||plan.days.some(d=>d.id===lid))) jump(lid); return false; }
    const first=document.querySelector(`.card[data-id="${live[0]}"]`);
    if(first) first.scrollIntoView({behavior:"smooth",block:"center",inline:"center"});
    live.forEach(id=>{ const c=document.querySelector(`.card[data-id="${id}"]`); if(!c) return; c.classList.remove("hl"); void c.offsetWidth; c.classList.add("hl"); setTimeout(()=>c.classList.remove("hl"),2600); });
    return true;
  }
  function dismiss(){ events=[]; keep(); paint(); }
  document.addEventListener("click",e=>{
    const x=e.target.closest&&e.target.closest("[data-chg-x]"); if(x){ dismiss(); return; }
    const b=e.target.closest&&e.target.closest("[data-chg]"); if(b){ const L=lines()[+b.dataset.chg]; if(L) spot(L.ids,L.lid); }
  });
  return {note,paint,dismiss,lines:()=>lines().map(L=>({who:L.who,a:L.a,lid:L.lid,ids:L.ids.slice(),text:text(L)})),get events(){return events},arm(){armed=true;},get armed(){return armed}};
})();

/* Maybe list: unplaced ideas (plan.ideas). Add, heart, pop into a day, delete (with undo). */
function addIdea(title,note,city){
  title=String(title||"").trim().slice(0,120); if(!title){ toast(T("tMaybeNeed")); return null; }
  note=String(note||"").trim().slice(0,600);
  const cat=/hot ?pot|food|eat|restaurant|noodle|dumpling|duck|bao|cafe|coffee|tea|bar|snack|dessert|ร้าน|กิน|อาหาร|หม้อไฟ|ก๋วยเตี๋ยว|เป็ด|เกี๊ยว|คาเฟ่|กาแฟ|ชา|ขนม/i.test(title)?"food":/shop|mall|market|outlet|ช้อป|ตลาด|ห้าง/i.test(title)?"shopping":"sightseeing";
  const raw={id:uid(),cat,status:"idea",link:"",time_en:"",time_th:"",title_en:title,title_th:title,notes_en:note,notes_th:note};
  if(city==="北京"||city==="上海") raw.zh_city=city;
  const it=normalize({title_en:"x",title_th:"x",days:[],ideas:[raw]}).ideas[0];
  snapshot(); plan.ideas.push(it); logAct("idea",it,"ideas"); commit(); toast(T("tIdeaAdded"),true);
  return it;
}
const hhmm=s=>{ const m=String(s||"").match(/^\s*(\d{1,2})[:.](\d{2})/); return m?(+m[1])*60+(+m[2]):null; };
function ideaToDay(id,lid,time){
  const f=findItem(id), day=plan.days.find(d=>d.id===lid); if(!f||!day) return false;
  snapshot(); const it=f.item; f.list.splice(f.idx,1);
  time=String(time||"").trim();
  if(time){ if(tx(it,"time")) setTx(it,"time",time); else setBoth(it,"time",time); }
  if(it.status==="idea") it.status="planned";
  const t=hhmm(it.time_en); let at=day.items.length;
  if(t!=null){ const k=day.items.findIndex(x=>{ const v=hhmm(x.time_en); return v!=null&&v>t; }); if(k>=0) at=k; }
  day.items.splice(at,0,it); logAct("move",it,lid); commit(); return true;
}
function toMaybe(id){
  const f=findItem(id); if(!f||f.lid==="ideas") return false;
  snapshot(); f.list.splice(f.idx,1); if(f.item.status==="planned") f.item.status="idea";
  plan.ideas.push(f.item); logAct("maybe",f.item,"ideas"); commit(); toast(T("tToMaybe"),true); return true;
}
function mbRow(it){
  const title=tx(it,"title"), notes=tx(it,"notes"), n=navInfo(it,null), id=esc(it.id);
  const city=String(it.zh_city||"")||navCity(it,null);
  const pre=(plan.days.find(d=>navCity({},d)===city&&city)||plan.days[0]||{}).id;
  return `<li class="mbi" data-id="${id}">
    <div class="mbt"><span class="cemo" aria-hidden="true">${CAT_EMO[it.cat]||"⭐"}</span>${esc(title)}</div>
    ${notes?`<div class="mbnote">${esc(notes)}</div>`:""}
    <div class="mbrow">${n?`<div class="cnav"><button class="nbtn" type="button" data-driver="${id}" aria-label="${esc(T("navDriverAria")(title))}">${T("navDriver")}</button></div>`:""}${pickHTML(it,null,title,true,true)}</div>
    <div class="mbrow mbact"><button class="btn mbday" type="button" data-today aria-expanded="false">${esc(T("mbToDay"))}</button><button class="btn mbdel" type="button" data-mbdel aria-label="${esc(T("mbDelA")(title))}">🗑</button></div>
    <div class="mbpick" hidden>
      <div class="row2"><label class="field"><span>${esc(T("mbWhich"))}</span><select name="day">${plan.days.map(d=>`<option value="${esc(d.id)}"${d.id===pre?" selected":""}>${esc(dayLabel(d.id))}</option>`).join("")}</select></label>
      <label class="field"><span>${esc(T("mbTime"))}</span><input name="time" value="${esc(tx(it,"time"))}" placeholder="${esc(T("mbTimePh"))}" list="timeSug"></label></div>
      <button class="btn primary" type="button" data-place>${esc(T("mbPlace"))}</button>
    </div></li>`;
}
function paintMaybe(){
  const ul=document.querySelector("#sheet .mbs"); if(!ul) return;
  const openId=(ul.querySelector(".mbi.open")||{}).dataset; const keepOpen=openId&&openId.id;
  const score=it=>PICK_WHO.reduce((n,w)=>{ const p=(it.picks||{})[w]; return n+(p?(p.s?2:0)+(p.h?1:0):0); },0);
  const L=plan.ideas.map((it,i)=>({it,i})).sort((a,b)=>score(b.it)-score(a.it)||a.i-b.i);
  ul.innerHTML=L.length?L.map(x=>mbRow(x.it)).join(""):`<li class="mbempty">${esc(T("mbEmpty"))}</li>`;
  const cnt=document.querySelector("#sheet .mbcount"); if(cnt) cnt.textContent=plan.ideas.length;
  if(keepOpen){ const r=ul.querySelector(`.mbi[data-id="${keepOpen}"]`); if(r){ r.classList.add("open"); r.querySelector(".mbpick").hidden=false; r.querySelector("[data-today]").setAttribute("aria-expanded","true"); } }
}
function openMaybe(){
  openSheet(`<h2><span>${esc(T("mbH"))} <span class="mbcount">${plan.ideas.length}</span></span>${closeX()}</h2>
    <p class="hint">${esc(T("mbSub"))}</p>
    <form class="mbform" autocomplete="off">
      <label class="field"><span>${esc(T("mbTitle"))}</span><input name="mbt" maxlength="120" placeholder="${esc(T("mbTitlePh"))}"></label>
      <label class="field"><span>${esc(T("mbNote"))}</span><textarea name="mbn" rows="2" maxlength="600" placeholder="${esc(T("mbNotePh"))}"></textarea></label>
      <div class="field"><span>${esc(T("mbCity"))}</span><div class="seg" data-seg="city">
        <button type="button" data-v="北京" aria-pressed="false">🏯 ${esc(T("cBJ"))}</button><button type="button" data-v="上海" aria-pressed="false">🌃 ${esc(T("cSH"))}</button><button type="button" data-v="" aria-pressed="true">🤷 ${esc(T("mbAny"))}</button></div></div>
      <button class="btn primary mbaddb" type="submit">${esc(T("mbAdd"))}</button>
    </form>
    <datalist id="timeSug">${T("slots").map(x=>`<option>${esc(x)}</option>`).join("")}</datalist>
    <ul class="mbs"></ul>`,
  s=>{
    s.classList.add("mbsheet");
    s.querySelector("[data-x]").onclick=closeSheet;
    let city="";
    s.querySelector("[data-seg=city]").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
      s.querySelectorAll("[data-seg=city] button").forEach(x=>x.setAttribute("aria-pressed",x===b)); city=b.dataset.v; });
    const form=s.querySelector(".mbform");
    form.addEventListener("submit",e=>{ e.preventDefault(); const t=form.mbt.value;
      if(!t.trim()){ toast(T("tMaybeNeed")); form.mbt.focus(); return; }
      if(addIdea(t,form.mbn.value,city)){ form.mbt.value=""; form.mbn.value=""; }
    });
    s.querySelector(".mbs").addEventListener("click",e=>{
      const t=e.target, row=t.closest(".mbi"); if(!row) return; const id=row.dataset.id;
      const pk=t.closest("[data-pick]"); if(pk){ togglePick(id,pk.dataset.pick); return; }
      if(t.closest("[data-driver]")){ showDriver(id); return; }
      const td=t.closest("[data-today]"); if(td){ const box=row.querySelector(".mbpick"); const op=box.hidden;
        s.querySelectorAll(".mbi.open").forEach(r=>{ r.classList.remove("open"); r.querySelector(".mbpick").hidden=true; r.querySelector("[data-today]").setAttribute("aria-expanded","false"); });
        if(op){ row.classList.add("open"); box.hidden=false; td.setAttribute("aria-expanded","true"); box.scrollIntoView({block:"nearest",behavior:"smooth"}); } return; }
      if(t.closest("[data-place]")){ const lid=row.querySelector("[name=day]").value, tm=row.querySelector("[name=time]").value;
        if(ideaToDay(id,lid,tm)){ closeSheet(); toast(T("tToDay")(dayLabel(lid)),true); setTimeout(()=>{ const c=document.querySelector(`.card[data-id="${id}"]`); if(c){ c.scrollIntoView({behavior:"smooth",block:"center",inline:"center"}); c.classList.add("hl"); setTimeout(()=>c.classList.remove("hl"),2600); } },60); }
        return; }
      if(t.closest("[data-mbdel]")){ deleteItem(id); return; }
    });
    paintMaybe();
  });
}

/* ---------- shared online copy (sync) ---------- */
// One shared JSON document on textdb.dev, keyed by an unguessable id. Last write wins.
// Shared doc: {app,rev,by,plan}. rev = time (ms) of the edit it contains.
// Local meta: {rev: rev of the shared copy this device last synced with, dirty: unsynced local edits, editedAt}.
const Sync=(function(){
  const META_KEY="chinaTripPlanner.sync", ID_KEY="chinaTripPlanner.syncId", DEV_KEY="chinaTripPlanner.device", FLASH_KEY="chinaTripPlanner.flash";
  let id=BUILD.syncId;
  try{ const m=location.hash.match(/[#&]s=([A-Za-z0-9_-]{8,80})/); if(m){ id=m[1]; localStorage.setItem(ID_KEY,id); } else id=localStorage.getItem(ID_KEY)||id; }catch(e){}
  const url=()=>BUILD.endpoint+encodeURIComponent(id);
  let dev; try{ dev=localStorage.getItem(DEV_KEY); if(!dev){ dev=uid(); localStorage.setItem(DEV_KEY,dev);} }catch(e){ dev=uid(); }
  let meta={rev:0,dirty:false,editedAt:0};
  try{ const m=localStorage.getItem(META_KEY);
    if(m) Object.assign(meta,JSON.parse(m));
    else { const s=localStorage.getItem(STORE_KEY); // plan saved by an older (offline-only) version: treat as unsynced edits, so they're never lost silently
      if(s){ meta.dirty=true; meta.editedAt=Date.parse(JSON.parse(s).savedAt||"")||1; } } }catch(e){}
  const saveMeta=()=>{ try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){} };
  let state="saved", timer=null, chain=Promise.resolve(), lastChecked=0, deferred=false;
  const POLL_MS=window.__pollMs||30000;
  // she's in the middle of something: an open sheet/dialog, a drag (or long-press about to become one), or typing the title
  const busy=()=>!!$("#sheet")||!!drag||!!pending||document.body.classList.contains("dragging")||document.activeElement===$("#title");
  const queue=fn=>(chain=chain.then(fn,fn));
  const fmt=ms=>{ if(!ms) return ""; const d=new Date(ms), now=new Date(); const loc=lang==="th"?"th-TH-u-ca-gregory":"en-GB";
    const o=d.toDateString()===now.toDateString()?{hour:"2-digit",minute:"2-digit"}:{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"};
    return d.toLocaleString(loc,o); };
  function paint(){
    const el=$("#sync"); if(!el) return; el.dataset.s=state;

    [66,"🌧️","Freezing rain","ฝนเยือกแข็ง"],[67,"🌧️","Freezing rain","ฝนเยือกแข็ง"],[71,"🌨️","Light snow","หิมะเบา ๆ"],[73,"🌨️","Snow","หิมะตก"],[75,"❄️","Heavy snow","หิมะหนัก"],
    [77,"🌨️","Snow grains","เกล็ดหิมะ"],[80,"🌦️","Showers","ฝนโปรย"],[81,"🌧️","Showers","ฝนโปรย"],[82,"⛈️","Heavy showers","ฝนหนักเป็นพัก ๆ"],
    [85,"🌨️","Snow showers","หิมะโปรย"],[86,"❄️","Heavy snow showers","หิมะโปรยหนัก"],[95,"⛈️","Thunderstorm","พายุฝนฟ้าคะนอง"],[96,"⛈️","Thunderstorm","พายุฝนฟ้าคะนอง"],[99,"⛈️","Thunderstorm","พายุฝนฟ้าคะนอง"]];
  const code=c=>CODES.find(x=>x[0]===Number(c))||[c,"🌡️","",""];
  // China time (UTC+8) date + hour
  const chinaNow=()=>{ const t=new Date(Date.now()+8*3600e3); return {iso:t.toISOString().slice(0,10),h:t.getUTCHours()}; };
  function cityKey(){
    const n=chinaNow(); const d=plan&&plan.days.find(x=>x.date===n.iso); if(!d) return "beijing";
    const c=(d.city_en||"")+" "+(d.weather||[]).map(w=>w.city).join(" ");
    const bj=/beijing/i.test(c), sh=/shanghai/i.test(c);
    if(bj&&sh) return n.h<14?"beijing":"shanghai";   // travel day: Beijing in the morning, Shanghai from the afternoon
    return sh?"shanghai":"beijing";
  }
  let data=null, busyF=false;
  const read=()=>{ try{ return JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ return null; } };
  async function load(force){
    const k=cityKey(), c=read();
    if(c&&c.city===k&&Date.now()-c.t<TTL&&!force){ data=c; paint(); return "cache"; }
    if(busyF) return "busy"; busyF=true;
    try{
      const C=CITY[k];
      const url=`https://api.open-meteo.com/v1/forecast?latitude=${C.lat}&longitude=${C.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=Asia%2FShanghai&forecast_days=1`;
      const r=await fetch(url,{cache:"no-store"}); if(!r.ok) throw new Error("http "+r.status);
      const j=await r.json(); if(!j.current||j.current.temperature_2m==null) throw new Error("bad data");
      data={city:k,t:Date.now(),temp:Math.round(j.current.temperature_2m),code:j.current.weather_code,
        hi:j.daily&&j.daily.temperature_2m_max?Math.round(j.daily.temperature_2m_max[0]):null,lo:j.daily&&j.daily.temperature_2m_min?Math.round(j.daily.temperature_2m_min[0]):null};
      try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){}
      paint(); return "fetched";
    }catch(e){ if(c&&c.city===k&&Date.now()-c.t<6*3600e3){ data=c; paint(); } return "failed"; }   // silent: keep a recent cached value, else stay hidden
    finally{ busyF=false; }
  }
  function paint(){
    const el=$("#wxnow"); if(!el) return;
    if(!data){ el.hidden=true; return; }
    const C=CITY[data.city]||CITY.beijing, [_,icon,en,th]=code(data.code);
    el.innerHTML=`<span aria-hidden="true">${icon}</span> <b>${esc(T("wxNow")(C[lang]))} ${tdeg(data.temp)}C</b>`+
      `<span class="wxrest">${data.hi!=null?" · "+esc(T("wxHL")(tdeg(data.hi),tdeg(data.lo))):""}${(lang==="th"?th:en)?" · "+esc(lang==="th"?th:en):""}</span>`;
    el.title=`Open-Meteo · ${new Date(data.t).toLocaleTimeString()}`; el.hidden=false;
  }
  setInterval(()=>{ if(document.visibilityState==="visible") load(); },5*60*1000);   // cheap: served from the 30-min cache
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") load(); });
  return {load,paint,cityKey,CODES,get data(){return data},TTL,KEY};
})();
/* ---------- boot ---------- */
async function boot(){
  plan=load(); render();
  const synced=Sync.boot();
  synced.then(r=>{ if(r&&r!=="offline") Changes.arm(); },()=>{});
  Chat.poll();
  try{ Wx.load(); }catch(e){}
  try{ if(!localStorage.getItem(HELP_KEY)) $("#firsthelp").hidden=false; }catch(e){}
  if(/#.*\b[zj]=/.test(location.hash)){
    await synced; // a shared link opened on purpose wins over the shared copy
    try{ const p=await decodePlan(location.hash); if(p){ replacePlan(p,T("tOpened")); } }
    catch(e){ toast(e.message||T("tOpenFail")); }
    window.history.replaceState(null,"",location.href.split("#")[0]);
  }
  window.__planner={nav:{navPlatform,amapNativeUrl,amapUrl,openAmap,get timer(){return amapTimer}},get plan(){return plan},get lang(){return lang},setLang,tx,normalize,moveItem:(id,l,i)=>{snapshot();moveItem(id,l,i);commit();},deleteItem,nudge,encodePlan,decodePlan,shareLink,undo,STORE_KEY,Sync,Changes,whoAmI,togglePick,openMaybe,addIdea,ideaToDay,toMaybe,Chat,Wx,BUILD,ready:true};
}
boot();
})();
