<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b5502f">
<meta name="app-build" content="20261115062110">
<title>Our China Trip • Trip Planner</title>
<style>
:root{
  --bg:#faf6f0;--card:#fff;--ink:#2d2722;--muted:#7a6e64;--line:#eadfd2;
  --accent:#b5502f;--accent2:#e9a23b;--accent-soft:#fbe9df;
  --ok:#2f8a57;--ok-soft:#e3f4ea;--warn:#b97400;--warn-soft:#fff2d6;--idea:#7a55b8;--idea-soft:#efe8fa;
  --radius:14px;--shadow:0 1px 2px rgba(60,40,20,.08),0 2px 8px rgba(60,40,20,.06);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI","Leelawadee","Tahoma","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{background:linear-gradient(135deg,#b5502f,#d9783e);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.jump{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#a9472a,#cf6e38);padding:8px 14px 0;box-shadow:0 2px 10px rgba(120,50,20,.25)}
.titlerow{display:flex;align-items:center;gap:8px}
#title{flex:1;min-width:0;background:transparent;border:0;border-radius:8px;color:#fff;font-size:20px;font-weight:700;padding:6px 6px;
  text-overflow:ellipsis}
.lang{flex:none;display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:6px 12px;min-height:36px;min-width:48px}
.lang button[aria-pressed=true]{background:#fff;color:var(--accent)}
:lang(th) .ctitle,:lang(th) .dtitle{line-height:1.4}
#title:focus{background:rgba(255,255,255,.18);outline:none}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:rgba(255,255,255,.18);
  color:#fff;padding:8px 13px;font-size:14px;font-weight:500;min-height:38px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tbtn.primary{background:#fff;color:var(--accent)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.spin::first-letter{display:inline-block}
.wxnow{display:block;max-width:100%;margin:6px 0 0;padding:4px 11px;border-radius:999px;background:rgba(0,0,0,.16);font-size:13px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:fit-content}
.wxnow[hidden]{display:none}
.wxnow b{font-weight:700}
.wxnow .wxrest{opacity:.92}
.dwx{margin-top:4px;font-size:12px;color:#6a5a4b;line-height:1.35}
.dwx .wxl{display:block}
.dwx b{font-weight:700;color:#4a3b2e}
.dwx small{color:var(--muted);font-size:11px}
.sync{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:rgba(255,255,255,.92);padding:0 2px 8px;min-height:18px}
.sdot{width:8px;height:8px;border-radius:50%;background:#9be3b4;flex:none}
.sync[data-s=saving] .sdot,.sync[data-s=checking] .sdot{background:#ffd27a}
.sync[data-s=offline] .sdot{background:#ff9d8a}
#stime,#sauto{opacity:.8}
#sauto{flex-basis:100%;padding-left:14px}
#stime:not(:empty)::before{content:"· "}
.ver{margin-top:12px;font-size:12px;color:var(--muted)}
.foot{text-align:center;margin:0 0 18px;padding:0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:10px;background:rgba(0,0,0,.14);color:#fff;padding:5px 10px;font-size:12.5px;line-height:1.2;text-align:left}
.chip b{display:block;font-size:13px}
.chip:hover{background:rgba(0,0,0,.24)}

@media (max-width:480px){#title{font-size:17px}.lang button{min-width:42px;padding:6px 10px}}
/* board */
#board{display:flex;flex-direction:column;gap:14px;padding:14px;max-width:640px;margin:0 auto}
.day{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;scroll-margin-top:70px}
.day.ideas{background:#fffdf8;border:2px dashed #e6cfa9}
.dhead{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;cursor:pointer;border-radius:var(--radius) var(--radius) 0 0}
.dhead:hover{background:#fdf9f4}
.dnum{flex:none;width:46px;border-radius:10px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:5px 0;line-height:1.1}
.dnum small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.dnum b{font-size:19px}
.ideas .dnum{background:#fff1d6;color:#a26a00;font-size:22px;padding:8px 0}
.dinfo{flex:1;min-width:0}
.dinfo .date{font-size:12.5px;color:var(--muted);font-weight:500}
.dinfo .dtitle{font-size:16px;font-weight:700;margin:1px 0 4px;line-height:1.25}
.city{display:inline-block;font-size:11.5px;font-weight:600;background:#f3ece3;color:#6a5a4b;border-radius:999px;padding:2px 8px;margin-right:4px}
.stay{display:inline-block;font-size:12px;color:var(--muted)}
.ibtn{flex:none;border:0;background:transparent;border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{background:#f3ece3;color:var(--ink)}
.tips{margin:8px 12px 0;background:#fff8e6;border-radius:10px;font-size:13px;color:#6b5320}
.tips summary{cursor:pointer;padding:7px 10px;font-weight:600;list-style:none}
.tips summary::-webkit-details-marker{display:none}
.tips p{margin:0;padding:0 10px 9px;white-space:pre-wrap;line-height:1.4}
.list{list-style:none;margin:0;padding:8px 10px 4px;min-height:56px;display:flex;flex-direction:column;gap:8px}
.list:empty::before{content:attr(data-empty);display:block;text-align:center;color:#b8aa9b;font-size:13px;padding:14px;border:2px dashed var(--line);border-radius:10px}
.addbtn{margin:2px 10px 10px;border:0;border-radius:10px;background:transparent;color:var(--accent);font-weight:600;padding:10px;text-align:left;min-height:44px;font-size:14.5px}
.addbtn:hover{background:var(--accent-soft)}
.addday{border:2px dashed #e3cdb8;background:transparent;border-radius:var(--radius);color:var(--accent);font-weight:700;padding:18px;font-size:15px;min-height:60px}
.addday:hover{background:var(--accent-soft)}

/* cards */
.card{position:relative;display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,#ccc);
  border-radius:11px;box-shadow:0 1px 2px rgba(0,0,0,.04);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card:hover{border-color:#dccbb8;border-left-color:var(--c)}
.card[data-cat=sightseeing]{--c:#d9783e}.card[data-cat=food]{--c:#d24d57}.card[data-cat=travel]{--c:#3a7bd5}
.card[data-cat=hotel]{--c:#7a55b8}.card[data-cat=shopping]{--c:#2fa08a}.card[data-cat=other]{--c:#9a8f84}
.handle{flex:none;width:30px;border:0;background:transparent;color:#c2b5a7;font-size:17px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;border-radius:8px 0 0 8px;padding:0}
.handle:hover,.handle:focus-visible{color:var(--accent);background:#fbf3ec}
.cbody{flex:1;min-width:0;padding:9px 10px 9px 2px;cursor:pointer}
.ctop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:2px}
.ctime{font-weight:600;color:#5c5047}
.ctitle{font-size:14.5px;font-weight:600;line-height:1.3;word-wrap:break-word}
.cemo{margin-right:4px}
.cnotes{font-size:12.8px;color:var(--muted);line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.clink{display:inline-block;margin-top:4px;font-size:12.5px;color:#3a7bd5;text-decoration:none;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.03em}
.pill.booked{background:var(--ok-soft);color:var(--ok)}
.pill.confirm{background:var(--warn-soft);color:var(--warn)}
.pill.idea{background:var(--idea-soft);color:var(--idea)}
.card.dragging-src{opacity:.35;border-style:dashed}
.ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 12px 30px rgba(60,30,10,.28);transform:rotate(2deg) scale(1.02);opacity:.96;margin:0}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.dragging .card,body.dragging .cbody{cursor:grabbing}
.list.over{background:#fff6ee;border-radius:10px}
.card.lifting{transform:scale(1.02);box-shadow:0 6px 18px rgba(0,0,0,.15);transition:transform .15s}

/* desktop columns */
@media (min-width:900px){
  #board{flex-direction:row;align-items:flex-start;max-width:none;overflow-x:auto;padding:16px 16px 28px;min-height:calc(100vh - 140px);scroll-snap-type:x proximity}
  .day,.addday{flex:none;width:300px;scroll-snap-align:start;scroll-margin-left:16px}
  .day{max-height:none}
  .addday{height:120px}
  header,.jump{padding-left:20px;padding-right:20px}
  #title{font-size:22px}
}

/* sheet / modal */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(40,25,15,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:600px){.backdrop{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;background:#fff}
.field textarea{min-height:90px;resize:vertical;line-height:1.4}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;min-height:40px}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;font-size:15px;min-height:46px;background:#f3ece3}
.btn.primary{background:var(--accent);color:#fff;flex:1}
.btn.danger{background:#fdeaea;color:#b3261e}
.btn:hover{filter:brightness(.97)}
.movebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#faf6f0;border-radius:12px;padding:8px}
.movebar select{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:9px;padding:8px;font-size:15px;background:#fff}
.movebar .btn{min-height:40px;padding:8px 12px}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 10px}
/* tap-to-navigate */
.cnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nbtn{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 11px;min-height:32px;font:inherit;font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.nbtn:hover,.nbtn:focus-visible{background:var(--accent-soft);border-color:#e3cdb8;color:var(--accent)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.zhsec{margin:4px 0 2px}
.zhsec summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 0;min-height:32px}
/* show-the-driver pop-up */
body:has(.sheet .driver) #chatFab{display:none}
.sheet.drv{padding:8px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(40,25,15,.22);overscroll-behavior:contain}
@media (min-width:600px){.sheet.drv{border-radius:22px;padding-bottom:20px}}
.dgrab{width:40px;height:5px;border-radius:3px;background:#e2d6c8;margin:0 auto 10px}
.dhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dhd h2{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
.driver{position:relative;text-align:center;background:linear-gradient(180deg,#fffaf3,#fff);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08)}
.dask{display:inline-block;font-size:14px;font-weight:600;letter-spacing:.12em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 14px 5px 16px;margin-bottom:14px}
.dzh{text-wrap:balance;font-size:clamp(32px,10vw,46px);font-weight:800;line-height:1.18;letter-spacing:.02em;color:var(--ink);word-break:break-word;-webkit-user-select:text;user-select:text}
.dzh.dkw{font-size:clamp(22px,7vw,30px);font-weight:700;letter-spacing:0}
.daddr{text-wrap:balance;font-size:clamp(19px,5.6vw,24px);font-weight:600;line-height:1.5;color:#3d342d;margin-top:12px;word-break:break-word;-webkit-user-select:text;user-select:text}
.den{font-size:12.5px;line-height:1.4;color:var(--muted);margin-top:12px}
.dnote{font-size:13px;line-height:1.45;color:var(--muted);margin:12px 2px 0}
.ddiv{height:1px;background:var(--line);margin:16px 0 14px}
.dcopy{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.dcopy .dbtn:only-child{grid-column:1/-1}
.dbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:15px;font-weight:600;line-height:1.2;text-align:center;text-decoration:none;box-sizing:border-box;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .08s}
.dbtn:active{transform:scale(.98)}
.dcopy .dbtn:hover{background:#fbf6f0}
.dbtn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dbtn.damap{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(181,80,47,.28)}
.dbtn.damap:hover{filter:brightness(1.05)}
.dtip{font-size:12.5px;line-height:1.45;color:var(--muted);text-align:center;margin:12px 4px 0}
@media print{.cnav,.cpick .pk,.changes{display:none!important}}
/* co-planning: picks */
.cpick{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;vertical-align:top}
.ctop .cpick{margin-left:auto;flex:none;gap:4px}
.ctop .pk{width:30px;height:30px;margin:-5px 0;font-size:14px}
.cpbs{margin-top:6px}
.cbody .cnav:has(+ .cpbs){display:inline-flex;margin-right:4px;vertical-align:middle}
.cnav + .cpbs{display:inline-flex;vertical-align:middle}
body:has(.sheet.mbsheet) #chatFab{display:none}
.pk{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:#b9aa9c}
.pk:hover,.pk:focus-visible{border-color:#e3cdb8;background:var(--accent-soft)}
.pk.on{background:#fff4e8;border-color:#f0c9a0;color:inherit}
.pbs{display:inline-flex;gap:4px;flex-wrap:wrap}
.pb{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:#f6efe8;color:#6b5a4c;white-space:nowrap}
.pb.pb-her{background:#fdeef3;color:#a43d64}
.pb.pb-keith{background:#eaf2fb;color:#2f5f8f}
.card.must{box-shadow:0 0 0 1.5px #f2c14e inset,0 1px 2px rgba(0,0,0,.04)}
.card.hl{animation:hl 2.4s ease-out}
@keyframes hl{0%,30%{box-shadow:0 0 0 3px #f2a33a,0 6px 18px rgba(242,163,58,.35);background:#fff6e6}100%{box-shadow:none;background:#fff}}
/* co-planning: what changed */
.changes{max-width:640px;margin:12px auto 0;padding:0 14px}
@media (min-width:900px){.changes{max-width:none;margin:12px 16px 0;padding:0}}
.chg{background:linear-gradient(180deg,#fffaf3,#fff);border:1px solid #f0d9bf;border-radius:14px;padding:10px 12px 8px;box-shadow:0 2px 8px rgba(181,80,47,.07)}
.chgh{display:flex;align-items:center;gap:8px;font-size:14px}
.chgh b{flex:1}
.chgx{min-height:32px;padding:4px 12px;font-size:13px}
.chg ul{list-style:none;margin:6px 0 0;padding:0}
.chgl{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:13.5px;color:var(--ink);padding:7px 2px;border-top:1px solid #f4e6d6;cursor:pointer;line-height:1.35}
.chg li:first-child .chgl{border-top:0}
.chgl:hover,.chgl:focus-visible{color:var(--accent)}
.chgd{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chga{margin-left:auto;color:var(--muted);font-size:17px;padding-left:6px}
.chgmore{font-size:12.5px;color:var(--muted);padding:4px 2px 2px 17px}
/* co-planning: Maybe list */
#bMaybe .mbn{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:rgba(255,255,255,.3);font-size:11.5px;text-align:center;margin-left:2px}
.mbcount{display:inline-block;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;text-align:center;vertical-align:middle}
.mbform{background:#faf6f1;border:1px solid var(--line);border-radius:14px;padding:12px 12px 4px;margin-bottom:14px}
.mbform .field{margin-bottom:10px}
.mbform textarea{min-height:56px}
.mbform .seg button{flex:1}
.mbaddb{width:100%;margin-bottom:8px;min-height:44px}
.mbs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mbi{border:1px solid var(--line);border-left:4px solid #e0b25a;border-radius:12px;padding:10px 12px;background:#fff}
.mbi.open{border-color:#f0c9a0;box-shadow:0 2px 10px rgba(181,80,47,.08)}
.mbt{font-weight:600;font-size:15px;line-height:1.3}
.mbt .cemo{margin-right:6px}
.mbnote{font-size:13px;color:#5c5047;margin-top:4px;white-space:pre-wrap;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mbrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mbrow .cnav,.mbrow .cpick{margin-top:8px}
.mbact{margin-top:8px}
.mbday{flex:1;min-height:38px}
.mbdel{min-height:38px;padding:0 12px}
.mbpick{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.mbpick .btn{width:100%;min-height:42px}
.mbempty{color:var(--muted);font-size:14px;text-align:center;padding:16px 8px;border:1px dashed var(--line);border-radius:12px;list-style:none}
.tomaybe{width:100%;margin-bottom:10px}
.x{border:0;background:#f3ece3;border-radius:50%;width:34px;height:34px;font-size:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);z-index:80;
  background:#2d2722;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s;max-width:calc(100vw - 24px)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{border:0;background:#e9a23b;color:#2d2722;font-weight:700;border-radius:8px;padding:7px 12px}
.firsthelp{max-width:640px;margin:12px auto 0;padding:0 14px}
.firsthelp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:#5c5047;display:flex;gap:10px;align-items:center}
.firsthelp button{margin-left:auto}
@media (min-width:900px){.firsthelp{max-width:none;margin:12px 16px 0;padding:0}}

/* print */
@media print{#chatFab,#chatPanel{display:none!important}
  @page{margin:12mm}
  header{position:static;background:none;color:#000;box-shadow:none;padding:0}
  #title{color:#000;font-size:22px;padding:0}
  .tools,.sync,.wxnow,.jump,.chips,.handle,.ibtn,.addbtn,.addday,#toast,.firsthelp,.backdrop{display:none!important}
  body{background:#fff}
  #board{display:block;padding:0;max-width:none;overflow:visible}
  .day{box-shadow:none;margin:0 0 10px;border:1px solid #ccc;width:auto}
  .dhead,.tips{break-after:avoid;page-break-after:avoid}
  .day.ideas.empty{display:none}
  .card{break-inside:avoid;box-shadow:none}
  .cnotes{-webkit-line-clamp:unset;display:block}
  .tips[open] p,.tips p{display:block}
  .clink::after{content:" (" attr(href) ")";color:#555;white-space:normal}
  .clink{white-space:normal}
}
/* chat bubble */
#chatFab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(120,50,20,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s}
#chatFab.on{transform:scale(.9)}
#toast.show~#chatFab{bottom:calc(84px + env(safe-area-inset-bottom))}
#chatFab .cdot{position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;background:#e23a3a;border:2px solid #fff}
#chatPanel{position:fixed;z-index:75;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));width:min(380px,calc(100vw - 32px));height:min(560px,calc(100dvh - 140px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 40px rgba(60,30,10,.28);display:flex;flex-direction:column;overflow:hidden}
#chatPanel[hidden]{display:none}
@media (max-width:520px){#chatPanel{left:8px;right:8px;width:auto;bottom:calc(84px + env(safe-area-inset-bottom));height:calc(100dvh - 150px)}}
#chatPanel .chead{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 14px;border-bottom:1px solid var(--line);background:var(--accent-soft)}
#chatPanel .chead b{flex:1;font-size:16px}
#chatPanel .cav{font-size:20px}
#chatPanel .cx{border:0;background:transparent;font-size:18px;padding:6px 8px;cursor:pointer;color:var(--muted)}
#chatPanel .cbody{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
#chatPanel .cnote{background:var(--warn-soft);border:1px solid #f0dcae;border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;margin-bottom:12px}
#chatPanel .cnote p{margin:0 0 6px}#chatPanel .cnote p:last-child{margin:0}
#chatPanel .clist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#chatPanel .cmsg{max-width:84%;padding:8px 11px;border-radius:16px;font-size:15px;line-height:1.45;word-wrap:break-word}
#chatPanel .cmsg.mine{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
#chatPanel .cmsg.theirs{align-self:flex-start;background:#f2ece5;border-bottom-left-radius:5px}
#chatPanel .cmsg.a-bot.theirs{background:var(--ok-soft)}
#chatPanel .cmsg a{color:inherit;text-decoration:underline;word-break:break-all}
#chatPanel .cmeta{font-size:11.5px;opacity:.75;margin-bottom:2px}
#chatPanel .ctext{white-space:pre-wrap}
#chatPanel .cst{font-size:11px;opacity:.8;text-align:right;margin-top:2px}
#chatPanel .cempty{color:var(--muted);text-align:center;font-size:14px;padding:12px}
#chatPanel .cstat{font-size:12px;color:var(--warn);padding:4px 14px;background:var(--warn-soft)}
#chatPanel .cform{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:flex-end}
#chatPanel textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font:inherit;font-size:16px;max-height:120px;background:#fff}
#chatPanel .cform .btn{flex:0 0 auto;width:auto;min-width:64px;padding:10px 16px}
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <label for="title" class="sr">Trip title</label>
    <input id="title" type="text" autocomplete="off" spellcheck="false">
    <div class="lang" role="group" aria-label="Language / ภาษา"><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="th" lang="th">ไทย</button></div>
  </div>
  <div class="wxnow" id="wxnow" role="status" hidden></div>
  <div class="tools" role="toolbar" aria-label="Plan tools">
    <button class="tbtn primary" id="bShare" type="button" data-t="share"></button>
    <button class="tbtn" id="bRefresh" type="button" data-t="refresh"></button>
    <button class="tbtn" id="bMaybe" type="button"></button>
    <button class="tbtn" id="bUndo" type="button" disabled data-t="undo"></button>
    <button class="tbtn" id="bDownload" type="button" data-t="download"></button>
    <button class="tbtn" id="bLoad" type="button" data-t="load"></button>
    <button class="tbtn" id="bPrint" type="button" data-t="print"></button>
    <button class="tbtn" id="bReset" type="button" data-t="reset"></button>
    <button class="tbtn" id="bHelp" type="button" data-t="help"></button>
  </div>
  <div class="sync" id="sync" role="status" aria-live="polite"><span class="sdot" id="sdot"></span><span id="stxt"></span><span id="stime"></span><span id="sauto"></span></div>
</header>
<div class="jump"><nav class="chips" id="chips" aria-label="Jump to day"></nav></div>
<div class="firsthelp" id="firsthelp" hidden><div>👋 <span data-th="banner"></span><button class="btn" id="hideHelp" type="button" data-t="gotit"></button></div></div>
<div class="changes" id="changes" hidden></div>
<main id="board" aria-label="Itinerary"></main>
<footer class="ver foot" id="footVer"></footer>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn" type="button" hidden data-t="undoShort"></button></div>

 days:[
  Object.assign(
  D("2026-12-24",["Beijing","ปักกิ่ง"],["Arrival, Lama Temple, Hutongs & Sanlitun Lights","ถึงปักกิ่งแล้ว! เริ่มเคานต์ดาวน์ปีที่ 4 ของเรา ❄️ • วัดลามะ • เดินหูท่ง • ไฟคริสต์มาสซานหลี่ถุน"],["Conrad Beijing (Chaoyang)","Conrad Beijing (ย่านเฉาหยาง)"],
   ["Beijing is dry and freezing (-8°C to 3°C). Wear an insulated down parka, thermal base layers, windproof gloves, and boots with good traction.\nKeep the afternoon gentle after the overnight flight; Guozijian is the easiest stop to drop.\nLama Temple winter hours: 09:00–16:30, last entry 16:00. Full-price tickets (¥25) can be bought online with a passport via the temple's WeChat account.\nDinner is on Christmas Eve, so book In & Out ahead.\n⏰ Flight HU7996 leaves BKK at 01:05: be at Suvarnabhumi by 22:00 on 23 Dec, bags packed by 21:00. No 'five more minutes', babe 😘\n⏰ Lama Temple's last entry is 16:00: be ready to leave Huajia Yiyuan by 13:40 (it's only a short Didi, or a ~20 min walk via Guijie).","ปีแรกเราอยู่ลอนดอน ปีที่สองญี่ปุ่น ปีที่แล้วปารีส ปีนี้ขอพาตัวเองไปวินเทอร์แลนด์จีนนะ ❄️ เคานต์ดาวน์ครั้งที่ 4 ของเราเริ่มแล้ว! ชาร์จแบตกล้องกับพาวเวอร์แบงก์ให้เต็มตั้งแต่คืนนี้เลย หน้าหนาวแบตหมดไวมาก 📸\nปักกิ่งหนาวแห้งมาก (-8°C ถึง 3°C) จัดเต็มเลยนะ: เสื้อดาวน์ตัวหนา ฮีทเทค/ลองจอห์นด้านใน ถุงมือกันลม และรองเท้าบูทพื้นไม่ลื่น\nเพิ่งลงเครื่องไฟลต์ดึกมา บ่ายนี้เดินชิล ๆ พอ ถ้าเหนื่อยตัดกั๋วจื่อเจียนออกได้เลย\nวัดลามะช่วงหน้าหนาว: เปิด 09:00–16:30 เข้าได้ถึง 16:00 ตั๋วเต็มราคา 25 หยวน ซื้อออนไลน์ด้วยพาสปอร์ตผ่าน WeChat ของวัดได้\nมื้อเย็นตรงกับคืนคริสต์มาสอีฟ จองร้าน In & Out ไว้ก่อนนะ\n⏰ ไฟลต์ HU7996 ออก 01:05 นะ: ต้องถึงสุวรรณภูมิภายใน 22:00 คืนวันที่ 23 ธ.ค. แพ็กกระเป๋าให้เสร็จก่อน 21:00 ห้ามขออีกห้านาทีนะคนสวย 😘✈️\n⏰ วัดลามะเข้าได้ถึงแค่ 16:00: พร้อมออกจากร้าน Huajia Yiyuan ภายใน 13:40 นะ ใกล้สุด ๆ เรียก Didi หรือเดินราว 20 นาทีผ่านกุ่ยเจียได้เลย ห้ามงีบหลังข้าวนะ 😆"],[

    ["Booked direct with Hilton: King Deluxe, check-in 15:00 / check-out 12:00 on 25 Dec. Arriving ~07:30, so ask for early check-in or drop bags. Confirmation number is in Keith's email.\nConrad Beijing, 29 North Dongsanhuan Road, Chaoyang, Beijing · +86 10 6584 6000","จองตรงกับ Hilton แล้ว: ห้อง King Deluxe เช็คอิน 15:00 / เช็คเอาต์ 12:00 วันที่ 25 ธ.ค. เราถึงราว 07:30 เลยขอเช็คอินก่อนเวลา หรือฝากกระเป๋าไว้ก่อนนะ เลขยืนยันการจองอยู่ในอีเมลของ Keith\nConrad Beijing, 29 North Dongsanhuan Road, Chaoyang, Beijing · +86 10 6584 6000"],"booked","https://www.hilton.com/en/book/reservation/find/"),

    ["Courtyard flagship at 东城区东直门内大街235号 (Guijie, Dongzhimennei). Traditional siheyuan setting. Try 花家白菜, 炸灌肠, 宫保鸡丁, 怡园霸王鸡 or 八旗羊排; skip the duck (Bianyifang duck is Day 2 dinner). Lunch 11:00–14:00; book ahead on 010-51283315. Didi from the Conrad ~20–25 min. Leave by ~13:40 for the Lama Temple (short Didi, or a ~20 min walk via Guijie / Dongzhimennei).","ร้านธงของเขาเลย เป็นบ้านซือเหอหยวนแท้ ๆ อยู่ที่ 东城区东直门内大街235号 (ถนนกุ่ยเจีย ตงจื๋อเหมินเน่ย) จาก Conrad เรียก Didi ราว 20–25 นาที เมนูที่อยากให้ลอง: 花家白菜 (ผักกาดขาวสูตรร้าน) 炸灌肠 (ไส้กรอกทอดแบบปักกิ่ง) 宫保鸡丁 怡园霸王鸡 หรือ 八旗羊排 ส่วนเป็ดข้ามไปก่อนนะ มื้อเย็นวันที่ 2 กินที่ Bianyifang แล้ว ร้านเปิดมื้อเที่ยง 11:00–14:00 จองไว้ก่อนเลย: 010-51283315 ออกจากร้านราว 13:40 ไปวัดลามะได้ เพราะใกล้มาก เรียก Didi สั้น ๆ หรือเดินราว 20 นาทีผ่านกุ่ยเจีย/ตงจื๋อเหมินเน่ย\n📸 ลานบ้านกับโคมแดงและลูกกรงไม้ถ่ายสวยมาก โดยเฉพาะแสงเที่ยง ๆ หน้าหนาว ยืนกลางลานแล้วให้โคมกับลายไม้เป็นเฟรม จะได้ฟีลปักกิ่งแบบหนังเลย"],"confirm","https://hk.trip.com/restaurant/china/beijing/detail/hua-s-restaurant-11084496/"),

   I("15:15","food",["Wudaoying Hutong: Coffee & Snacks","หูท่งอู่เต้าอิ๋ง (Wudaoying Hutong): แวะคาเฟ่ & ขนม"],
    ["Just west of the temple. Indie cafés and boutiques; warm up indoors.","อยู่ติดวัดทางฝั่งตะวันตก เต็มไปด้วยคาเฟ่และร้านเล็ก ๆ น่ารัก ๆ แวะนั่งจิบอะไรอุ่น ๆ หลบหนาวกัน\n📸 ซอยอิฐเทากับโคมแดงถ่ายฟีลชิค ๆ ได้ทั้งซอย บางคาเฟ่มีที่นั่งดาดฟ้ามองเห็นหลังคาวัดลามะ (เช็กว่าร้านไหนเปิด) ช็อตเด็ด: แก้วกาแฟอุ่น ๆ ตรงหน้าต่างไม้กับซอยหูท่งด้านหลัง"],"planned","https://www.youtube.com/shorts/GlEyGTRGO6k"),
   I("16:00","sightseeing",["Guozijian Street","ถนนกั๋วจื่อเจียน (Guozijian Street)"],
    ["The next lane south, under painted archways. Street only (~20–30 min); the light fades after 16:30 and it's dark by ~17:00. The easiest stop to drop if you're tired after the overnight flight.","ซอยถัดลงไปทางใต้ มีซุ้มประตูไม้ลายจีนสวย ๆ เดินเล่นแค่ถนนพอ (20–30 นาที) หลัง 16:30 ฟ้าเริ่มมืด และมืดสนิทราว 17:00 ถ้าเหนื่อยจากไฟลต์ดึก ข้ามจุดนี้ไปได้เลย\n📸 ซุ้มประตูไม้ทาสี (牌楼) คือพระเอก: ยืนกลางถนนแล้วถ่ายให้ซุ้มอยู่กลางเฟรม แนวต้นไม้สองข้างพาสายตาเข้าไป ราว 16:00 แดดเย็นสีทองยังมีอยู่ ใส่สีแดงหรือเขียวมรกตจะเข้ากับลายซุ้มมาก"],"planned","https://www.instagram.com/reel/Cx-oOhOSIyW/"),

    ["Old Beijing Walking Street: Mao'er / Fangzhuanchang hutongs. From Guozijian, ~20 min walk or ~8 min Didi; a dusk stroll as the lights come on (~17:00).","ถนนคนเดินปักกิ่งเก่า: แวะซอยเม่าเอ๋อร์ / ฟางจวนฉ่างด้วย จากกั๋วจื่อเจียนเดินราว 20 นาที หรือ Didi 8 นาที มาช่วงโพล้เพล้ตอนไฟเริ่มติด (ราว 17:00) บรรยากาศดีมาก\n📸 มาช่วงบลูอาวร์ (ราว 17:00–17:20) ฟ้ายังน้ำเงิน โคมแดงเพิ่งติด สวยสุด ถนนหลักคนแน่น เลี้ยวเข้าซอยข้าง ๆ อย่างเม่าเอ๋อร์หูท่งจะได้รูปประตูบ้านเก่ากับโคมแบบไม่มีคนติด"],"planned","https://www.instagram.com/reel/DNPJBJaohCn/?hl=en"),

rad 06:40 เดี๋ยวซื้อกาแฟให้ระหว่างทาง สัญญา ☕🥺\n⏰ ออกจากหอฟ้าเทียนถานภายใน 09:15 เพื่อให้ทันรอบพระราชวังต้องห้าม (10:00–10:30) ถ่ายรูปโหมดเร็วนะ 📸💨\n⏰ จองร้าน Bianyifang ไว้ 18:15: พร้อมที่ห้องภายใน 17:45 เรียก Didi 17:55 ตั้งนาฬิกาปลุกตอนงีบด้วยนะ 😴⏰"],[

    ["Hall of Prayer for Good Harvests. Park opens ~06:00, halls ~08:00. Plan on ~1.5h and leave by 09:15.","ไฮไลต์คือตำหนักฉีเหนียนเตี้ยน (หอบวงสรวงขอพรให้พืชผลอุดมสมบูรณ์) ที่เห็นในรูปบ่อย ๆ สวนเปิดราว 06:00 ตัวตำหนักเปิดราว 08:00 เดินสัก 1.5 ชม. แล้วออกให้ได้ภายใน 09:15\n📸 ช็อตโปสการ์ด: เดินขึ้นมาตามสะพานตันปี้ (丹陛桥) แกนกลาง แล้วถ่ายหอฉีเหนียนเตี้ยนให้สมมาตรกลางเฟรม พระอาทิตย์ขึ้นราว 07:30 แดดเช้าจะส่องหลังคาสีน้ำเงินสวยมาก ไปเช้าแบบนี้คนน้อยด้วย ใส่โค้ทแดงหรือขาวจะเด่นกับหลังคาน้ำเงิน แถมระเบียงยาวมีคุณลุงคุณป้าเล่นไพ่ ร้องเพลง ถ่ายแคนดิดน่ารักมาก"],"planned","https://www.youtube.com/shorts/G6qufdws3JQ"),

   I("12:45","sightseeing",["Jingshan Park (short visit)","สวนจิ่งซาน (แวะแป๊บเดียว)"],

    ["Old Beijing noodles with fried soybean-paste pork sauce, Michelin-listed for 6+ years (~¥38). Taxi ~10 min from Jingshan to Fangzhuanchang Hutong, off the north end of Nanluoguxiang. Walk-in only; queues of 30 min+ at peak, so 13:30 is after the rush. Then Didi ~15 min to the Wangfujing apartment.","บะหมี่ปักกิ่งต้นตำรับ คลุกซอสเต้าเจี้ยวผัดหมูสับเข้มข้น (ฟีลบะหมี่ซอสหมูสับ แต่หอมเต้าเจี้ยวกว่า) ติดมิชลินไกด์มา 6 ปีกว่า (ราว 38 หยวน) จากจิ่งซานนั่งแท็กซี่ 10 นาทีไปหูท่งฟางจวนฉ่าง ปลายเหนือของหนานหลัวกู่เซียง ไม่รับจอง ช่วงพีคคิว 30 นาทีขึ้นไป ไป 13:30 คนจะซาแล้ว กินเสร็จเรียก Didi 15 นาทีกลับอพาร์ตเมนต์หวังฟูจิ่ง"],"planned","https://www.youtube.com/shorts/zs-ak1JiAe4"),

    ["Base for Days 2–4; bags were dropped this morning. Rest and warm up. Optional: stroll Wangfujing Street (王府井) to Donghuamen (东华门) and the Forbidden City moat (筒子河) as the lights come on (~17:00).\nBooked on Agoda: check-in Fri 25 Dec 14:00, check-out Mon 28 Dec 12:00.","ที่พักหลักวันที่ 2–4 กระเป๋าฝากไว้ตั้งแต่เช้าแล้ว กลับมางีบ พักให้หายหนาว ถ้ายังไหว: เดินเล่นถนนหวังฟูจิ่ง (王府井) ไปตงหัวเหมิน (东华门) เลียบคูน้ำรอบพระราชวังต้องห้าม (筒子河) ตอนไฟเริ่มติด (ราว 17:00) ถ่ายรูปสวยมาก\nจองแล้วใน Agoda: เช็คอิน ศ. 25 ธ.ค. 14:00 เช็คเอาต์ จ. 28 ธ.ค. 12:00\n📸 ถ้าออกไปเดินตอนโพล้เพล้ คูน้ำรอบวัง (筒子河) ตอนไฟติดสวยมาก หอมุมพระราชวังต้องห้ามสะท้อนน้ำคือช็อตเด็ดของปักกิ่ง (มุมตะวันออกเฉียงเหนือ ราว 16:50)"],"booked","https://www.agoda.com/trips/shared/8402635a-b689-449c-9031-40b1f21372d5"),

   ["Train day: China rail is real-name, so carry both passports for the station security and ticket gates. Gates usually close about 5 min before departure (to confirm), so aim to be at Beijing South by ~11:20 for the 12:00 G15. Didi from Wangfujing is about 30–40 min (to confirm). Grab snacks/lunch at the station or order on the train; you arrive 16:38.\nHongqiao → hotel: Metro Line 10 runs from Hongqiao Railway Station straight to Xintiandi (no change, ~45 min), or Didi ~30–40 min.\nGetting around Shanghai: Didi works in Alipay (and its own app). For the Metro, use the Alipay transport QR code, or tap a contactless Visa/Mastercard at the gates (to confirm for your cards).\nThe Louis (LV ship): free, but book a timed slot ahead in the 'My LV' WeChat mini program or the official site. One booking per person, and only the live QR works (no screenshots). Open 10:00–22:00, so book a ~18:45 slot (Line 13 runs direct from Xintiandi to West Nanjing Rd). Nearest Metro: Line 13 West Nanjing Road, exit 6.\nShanghai in late December: about 2–9°C, damp and windy, so it feels colder than it reads. Layers plus a windproof jacket; an umbrella helps.\n⏰ G15 leaves Beijing South at 12:00: bags packed and checked out by 10:30, Didi at 10:45. A late brunch is fine, a late Didi is not 🚄😝\n⏰ The Louis entry is by time slot: be at the ship 10 min before your booked time 🛳️","วันนั่งรถไฟ: รถไฟจีนใช้ชื่อจริง ต้องพกพาสปอร์ตทั้งสองคนไว้ผ่านจุดตรวจและประตูขึ้นรถ ประตูมักปิดก่อนรถออกราว 5 นาที (รอยืนยัน) ไปให้ถึงสถานีปักกิ่งใต้ราว 11:20 สำหรับ G15 เที่ยวเที่ยงตรง นั่ง Didi จากหวังฟูจิ่งราว 30–40 นาที (รอยืนยัน) ซื้อขนม/ข้าวที่สถานีหรือสั่งบนรถไฟก็ได้ ถึงเซี่ยงไฮ้ 16:38\nจากสถานีหงเฉียวไปที่พัก: รถไฟใต้ดินสาย 10 วิ่งจากสถานี Hongqiao Railway Station ตรงไปซินเทียนตี้เลย ไม่ต้องต่อ (ราว 45 นาที) หรือ Didi ราว 30–40 นาที\nเดินทางในเซี่ยงไฮ้: เรียก Didi ผ่าน Alipay ได้เลย (หรือแอป Didi) รถไฟใต้ดินใช้ QR ขนส่งใน Alipay หรือแตะบัตร Visa/Mastercard แบบคอนแทกต์เลสที่ประตู (รอยืนยันว่าบัตรเราใช้ได้)\n    ["Yu Garden: open 09:00–16:30 (last entry 16:00), closed Mondays (29 Dec is a Tuesday); about ¥30 in December. Metro Line 10 Yuyuan Garden station, 2 stops from Xintiandi. Go at opening; the bazaar gets packed by late morning.\nWukang Mansion: nearest Metro is Jiaotong University (Lines 10/11), a short walk. From Yu Garden it's Line 10 direct.\nGaolaojiu hot pot is popular, so expect a queue at dinner time; check whether it takes bookings or online queue numbers (to confirm), or go early (~17:30).\n⏰ Yu Garden opens 09:00: out the door by 08:45 (after the jog and a quick shower) to beat the crowds. Shengjianbao tastes better when we're first in line 🥟\n⏰ Fuxing Road residences take last entry at 16:30: leave Wukang Mansion by 15:15 to reach Sinan Rd by 15:45. Photo shoot has a time limit, model 📷😜\nMorning jogs: at 07:00 it's usually around 1–5°C in late December (to confirm closer to the day), damp and sometimes windy by the river; sunrise is about 06:50. Wear a thermal base layer, a light windproof jacket, gloves and a beanie, and peel off as you warm up. Warm up indoors first.\n⏰ Running gear on and in the lobby by 06:50, sneakers tied. Sleepy face allowed, pyjamas not 🏃‍♀️😆","สวนอวี้หยวน: เปิด 09:00–16:30 (เข้าได้ถึง 16:00) ปิดวันจันทร์ (29 ธ.ค. เป็นวันอังคาร) ธันวาค่าเข้าราว 30 หยวน รถไฟใต้ดินสาย 10 สถานี Yuyuan Garden ห่างซินเทียนตี้ 2 สถานี ไปตอนเปิดดีสุด สาย ๆ ตลาดรอบสวนคนแน่นมาก\nตึกอู่คัง: รถไฟใต้ดินใกล้สุดคือสถานี Jiaotong University (สาย 10/11) เดินไม่ไกล จากอวี้หยวนนั่งสาย 10 ไปได้ตรง ๆ เลย\nหม้อไฟ Gaolaojiu คนเยอะ ช่วงมื้อเย็นน่าจะต้องต่อคิว เช็กว่ารับจองหรือกดคิวออนไลน์ได้ไหม (รอยืนยัน) หรือไปเร็วหน่อยราว 17:30\n⏰ สวนอวี้หยวนเปิด 09:00: วิ่งเสร็จอาบน้ำไว ๆ แล้วออกจากห้องภายใน 08:45 จะได้ไม่เบียดคน เซิงเจียนเปาอร่อยกว่าเวลาเราได้คิวแรก ๆ นะ 🥟😋\n⏰ บ้านเก่าบนถนนฟู่ซิงเข้าได้ถึง 16:30: ออกจากตึกอู่คังภายใน 15:15 ให้ถึงถนนซือหนาน 15:45 นางแบบถ่ายรูปมีเวลาจำกัดนะจ๊ะ 📷😜\nวิ่งตอนเช้า: 07:00 ปลายธันวาอุณหภูมิมักราว 1–5°C (รอเช็กพยากรณ์ใกล้วัน) ชื้นและริมแม่    ["Confirmed for 2026: a special 'Light Up the New Year' castle show on 31 Dec–1 Jan; Early Park Entry excludes Zootopia; Roaring Rapids is closed from 6 Dec (no reopening date yet) and Explorer Canoes are closed. Not published yet: NYE 2026 park hours, show times and fireworks. Last year's pattern (2025): park 08:30–22:00, Disneytown 10:00–22:00, shows at 20:00 and 21:15, adult ticket ¥719.\nPremier Access (paid express, per person): buy the 6-ride Adventure set (from ¥799; includes Zootopia, TRON and Seven Dwarfs Mine Train) as soon as it goes on sale, about 9 days ahead (~22 Dec). It also lists Roaring Rapids, which will be closed, so check what the 31 Dec set includes before paying. Add Soaring on the day if its wait is over ~60 min (single rides ~¥140–300, sold in the app on the day only). Prices rise on peak dates.\nApp: the official Shanghai Disney Resort app (上海迪士尼度假区) for ticket linking with both passports, live waits, Premier Access and mobile food orders. Alipay/WeChat with a foreign card adds 3% on payments over ¥200; Trip.com/Klook avoid that fee.\nCold: around 2–8°C, damp and windy. Thermals, gloves, a hat and hand warmers, especially for the 1.5 h wait before the castle show.\nFlight on 1 Jan is in the evening, so the late night is fine: sleep in and have a relaxed morning before heading to PVG.\nNYE crowd control (2025 pattern, expect similar): vehicles banned around the Bund 20:00–01:00; East Nanjing Rd station (Lines 2/10) and Yuyuan Garden station on Line 14 closed from 20:00; Lines 1, 7, 8, 9, 10 and 13 ran late. Line 11 wasn't on the late list, so check its last train. Police also manage crowds at Xintiandi.\nCountdown at Disney: it's the evening castle show with fireworks (2025: 20:00 and 21:15; park closed 22:00), not midnight. Line 11's last train is normally 22:30, so if NYE late running isn't announced, count down at the 20:00 show or plan a surge-priced Didi back. Back at the Riverdale ~23:00–23:30, in time for a midnight toast.\n⏰ Disney rope drop: up and ready by 06:10, Didi at 06:30. Zootopia waits for no bunny 🐰\n⏰ Castle show: be in the Gardens of Imagination by 18:30 to grab our spot ✨\n⏰ Countdown show at 21:15 (to confirm): stay in our spot, then straight to the Metro, no souvenir detours (last Line 11 is normally 22:30) 🎆😆","คืนเคานต์ดาวน์ครั้งที่ 4 ของเรา ✨ ปีที่แล้วปารีส ปีนี้นับถอยหลังกับพลุหน้าปราสาทดิสนีย์ บอกไว้ก่อนว่าคืนนี้ไม่มีหอไอเฟล แต่มีเราสองคนเหมือนเดิมนะ 🤍 แบตสำรองพกสองก้อน เพราะคืนนี้ถ่ายวิดีโอเยอะแน่\nที่ยืนยันแล้วสำหรับปี 2026: มีโชว์พิเศษ 'Light Up the New Year' ที่ปราสาท วันที่ 31 ธ.ค.–1 ม.ค. / บัตรเข้าก่อนเวลา (Early Park Entry) ไม่รวมโซน Zootopia / Roaring Rapids ปิดซ่อมตั้งแต่ 6 ธ.ค. (ยังไม่บอกวันเปิด) และ Explorer Canoes ก็ปิด ที่ยังไม่ประกาศ: เวลาเปิดสวน เวลาโชว์ และดอกไม้ไฟคืนส่งท้ายปี 2026 ปีที่แล้ว (2025) เป็นแบบนี้: สวนเปิด 08:30–22:00 Disneytown 10:00–22:00 โชว์ 20:00 และ 21:15 ตั๋วผู้ใหญ่ 719 หยวน\nPremier Access (ฟาสต์แทร็กแบบจ่ายเงิน ราคาต่อคน): ซื้อชุด Adventure 6 เครื่องเล่น (เริ่ม 799 หยวน มี Zootopia, TRON และ Seven Dwarfs Mine Train) ทันทีที่เปิดขาย ราว 9 วันก่อน (ประมาณ 22 ธ.ค.) แต่ชุดนี้มี Roaring Rapids ที่จะปิดด้วย เช็กก่อนจ่ายว่าชุดของวันที่ 31 ธ.ค. มีอะไรบ้าง ถ้าวันนั้น Soaring คิวเกิน 60 นาที ค่อยซื้อเพิ่ม (รายเครื่องราว 140–300 หยวน ขายในแอปเฉพาะวันที่ไป) วันคนเยอะราคาจะขึ้น\nแอป: ใช้แอปทางการ Shanghai Disney Resort (上海迪士尼度假区) ผูกตั๋วกับพาสปอร์ตทั้งสองคน ดูเวลาคิวสด ซื้อ Premier Access และสั่งอาหาร จ่ายผ่าน Alipay/WeChat ด้วยบัตรต่างประเทศโดนค่าธรรมเนียม 3% ถ้าเกิน 200 หยวน ซื้อผ่าน Trip.com/Klook ไม่โดน\nหนาว: ราว 2–8°C ชื้นและมีลม ใส่ฮีทเทค ถุงมือ หมวก พกแผ่นร้อนแปะ โดยเฉพาะตอนยืนรอโชว์ปราสาทราว 1.5 ชม.\nไฟลต์วันที่ 1 ม.ค. เป็นช่วงเย็น นอนดึกคืนนี้ได้สบาย ตื่นสายแล้วใช้ชีวิตชิล ๆ ก่อนไปสนามบิน PVG\nการคุมฝูงชนคืนส่งท้ายปี (ปี 2025 เป็นแบบนี้ ปีนี้น่าจะคล้ายกัน): ห้ามรถเข้าแถวเดอะบันด์ 20:00–01:00 สถานี East Nanjing Rd (สาย 2/10) และสถานี Yuyuan Garden ของสาย 14 ปิดตั้งแต่ 20:00 สาย 1, 7, 8, 9, 10 และ 13 วิ่งดึกกว่าปกติ แต่สาย 11 ไม่อยู่ในลิสต์ เช็กเวลารถเที่ยวสุดท้ายด้วย ที่ซินเทียนตี้ตำรวจก็คุมฝูงชนเหมือนกัน\nเคานต์ดาวน์ที่ดิสนีย์: เป็นโชว์ปราสาทพร้อมพลุช่วงค่ำ (ปี 2025 มีรอบ 20:00 กับ 21:15 สวนปิด 22:00) ไม่ใช่เที่ยงคืนนะ รถไฟสาย 11 เที่ยวสุดท้ายปกติ 22:30 ถ้าไม่มีประกาศวิ่งดึก นับถอยหลังรอบ 20:00 แทน หรือเผื่อค่า Didi ราคาพุ่งไว้ กลับถึง Riverdale ราว 23:00–23:30 ทันชนแก้วตอนเที่ยงคืนพอดี 🥂\n⏰ วันดิสนีย์: ตื่นและพร้อมภายใน 06:10 เรียก Didi 06:30 จูดี้ฮอปส์ไม่รอใครนะ 🐰💨\n⏰ โชว์ปราสาท: ไปจองที่ใน Gardens of Imagination ภายใน 18:30 นะ ✨🏰\n⏰ โชว์นับถอยหลัง 21:15 (รอยืนยัน): อยู่ที่เดิมห้ามขยับ จบแล้วตรงไปรถไฟใต้ดินเลย ห้ามแวะร้านของที่ระลึกนะ (สาย 11 เที่ยวสุดท้ายปกติ 22:30) 🎆😆"],[

    ["~45–50 min that early; drop-off at the West Public Transport Hub (西PTH), then a 5–10 min walk. Metro alternative: Line 10 to Jiaotong University, change to Line 11 to Disney Resort (~75 min).","เช้าขนาดนี้รถไม่ติด ราว 45–50 นาที ลงที่จุดจอดฝั่งตะวันตก (西PTH) แล้วเดินต่อ 5–10 นาที ถ้าจะนั่งรถไฟใต้ดิน: สาย 10 ไปสถานี Jiaotong University ต่อสาย 11 ไปสถานี Disney Resort (ราว 75 นาที)"],"planned",""),
   I("07:15","sightseeing",["Shanghai Disneyland","เซี่ยงไฮ้ดิสนีย์แลนด์"],
    ["Arrive for rope drop. Bring both passports and have the tickets linked in the official app. Bag security comes before the gate queue and both are long on NYE, so be in the gate queue by ~07:30. 2025 NYE hours were 08:30–22:00; 2026 hours aren't published yet. Buy tickets ahead (NYE 2025: ¥719/adult).","ไปรอก่อนสวนเปิด พกพาสปอร์ตทั้งสองคน และผูกตั๋วไว้ในแอปให้เรียบร้อย ต้องผ่านจุดตรวจกระเป๋าก่อนถึงคิวหน้าประตู คืนส่งท้ายปีคิวยาวทั้งสองจุด เลยควรไปยืนในคิวหน้าประตูให้ได้ราว 07:30 ปี 2025 สวนเปิด 08:30–22:00 ส่วนปี 2026 ยังไม่ประกาศ ซื้อตั๋วล่วงหน้าไว้เลย (คืนส่งท้ายปี 2025: ผู้ใหญ่ 719 หยวน)\n📸 ช็อตปราสาทคลาสสิก: ยืนกลาง Mickey Avenue/สวนหน้าปราสาท ถ่ายตอนเช้าก่อนคนเต็มลาน แล้วค่อยถ่ายอีกรอบตอนปราสาทเปิดไฟหลังมืด (ราว 17:15)"],"confirm","https://www.youtube.com/shorts/NKstPrb8XR4"),

    ["Straight up Mickey Avenue and right past the castle to Zootopia. Early Park Entry doesn't include Zootopia, so everyone starts at 08:30. Typical waits: ~40–50 min at opening, 80–95 min by late morning (more on NYE). If the opening wait is over ~60 min, use its Premier Access slot instead. Single rider exists but can close. Then explore the land for photos.","เดินตรงไปตาม Mickey Avenue แล้วเลี้ยวขวาผ่านปราสาทไปโซน Zootopia บัตรเข้าก่อนเวลาไม่รวมโซนนี้ ทุกคนเลยเริ่มพร้อมกันตอน 08:30 ปกติคิวราว 40–50 นาทีตอนเปิด และ 80–95 นาทีช่วงสาย (คืนส่งท้ายปีอาจนานกว่านี้) ถ้าตอนเปิดคิวเกิน 60 นาที ใช้ Premier Access แทนเลย มีช่องผู้เล่นเดี่ยว (single rider) แต่อาจปิด เล่นเสร็จเดินถ่ายรูปในโซนต่อ น่ารักมาก\n📸 ถ่ายป้ายทางเข้าโซน Zootopia ตอนเช้าที่คนยังน้อย แล้วค่อยกลับมาอีกทีตอนค่ำ โซนนี้เปิดไฟนีออนเมืองซูโทเปียสวยมาก"],"planned","https://www.youtube.com/shorts/Y_8aphqXwIw"),

    ["Eat before the noon rush. The midday parade (12:15 in 2025) blocks the central paths, so be on the Fantasyland side before it starts.","กินก่อนคนแห่กินเที่ยง ขบวนพาเหรดตอนเที่ยง (ปี 2025 เริ่ม 12:15) จะปิดทางเดินกลางสวน เลยควรข้ามไปฝั่ง Fantasyland ให้ได้ก่อนพาเหรดเริ่ม"],"planned",""),

   I("20:00","sightseeing",["NYE Fireworks & Castle Projection Show","โชว์ปราสาทและดอกไม้ไฟคืนส่งท้ายปี"],
    ["Special 'Light Up the New Year' (点亮新一年) castle show. In 2025 it ran at 20:00 and 21:15 with '2026' fireworks; 2026 times aren't published, and the 2026 announcement doesn't mention fireworks, so check the app. Claim a spot in the Gardens of Imagination (奇想花园) by ~18:30: the bridges facing the castle have the best view, and the Mickey Avenue side is quickest to the exit. Very cold standing still. The 21:15 show is our countdown (next card).","โชว์พิเศษ 'Light Up the New Year' (点亮新一年) ที่ปราสาท ปี 2025 มีรอบ 20:00 และ 21:15 พร้อมดอกไม้ไฟเป็นเลข '2026' ปี 2026 ยังไม่ประกาศเวลา และประกาศปีนี้ยังไม่พูดถึงดอกไม้ไฟ เช็กในแอปอีกที จองที่ยืนในสวน Gardens of Imagination (奇想花园) ให้ได้ภายใน 18:30 สะพานที่หันหน้าเข้าปราสาทวิวดีสุด ส่วนฝั่ง Mickey Avenue ออกจากสวนได้ไวสุด ยืนรอนาน ๆ หนาวมากนะ รอบ 21:15 คือรอบนับถอยหลังของเรา (การ์ดถัดไป)\n📸 ถ่ายวิดีโอแนวนอนเปิดกันสั่นไว้ และตั้งโหมด Live Photo จะได้ช็อตพลุกับปราสาทพร้อมกัน ยืนตรงสะพานที่หันเข้าปราสาทให้ปราสาทอยู่กลางเฟรม ปีที่แล้วปารีส ปีนี้ปราสาทดิสนีย์ ✨"],"confirm","https://www.youtube.com/shorts/tTr5PfK34m4"),
   I("21:15","sightseeing",["New Year Countdown at Shanghai Disneyland (castle fireworks)","นับถอยหลังปีใหม่ที่เซี่ยงไฮ้ดิสนีย์แลนด์ (พลุหน้าปราสาท)"],
    ["Count down together at the 'Light Up the New Year' (点亮新一年) castle show, which ends with a wish moment and year-number fireworks over the Enchanted Storybook Castle. It's an evening countdown, not midnight: on NYE 2025 the shows ran at 20:00 and 21:15 and the park closed at 22:00. 2026 show times, park hours and fireworks aren't published yet (to confirm in the app).\nBest spot: Gardens of Imagination (奇想花园), on the bridges or lawn facing the castle, with the castle centred. If you watched the 20:00 show, stay put for this one.\nGetting back: Line 11's normal last train from Disney Resort is 22:30, and after this show the station queues are long. If NYE late running isn't confirmed for Line 11, make the 20:00 show your countdown instead, or budget for a surge-priced Didi.","นับถอยหลังด้วยกันที่โชว์ปราสาท 'Light Up the New Year' (点亮新一年) ตอนจบมีช่วงอธิษฐานแล้วพลุเป็นเลขปีใหม่เหนือปราสาท Enchanted Storybook Castle เป็นเคานต์ดาวน์ช่วงค่ำนะ ไม่ใช่เที่ยงคืน ปี 2025 มีโชว์ 20:00 กับ 21:15 แล้วสวนปิด 22:00 ส่วนปี 2026 ยังไม่ประกาศเวลาโชว์ เวลาเปิดสวน และพลุ (รอยืนยันในแอป)\nจุดดูดีสุด: สวน Gardens of Imagination (奇想花园) บนสะพานหรือสนามหญ้าที่หันหน้าเข้าปราสาท ให้ปราสาทอยู่กลางเฟรม ถ้าดูรอบ 20:00 แล้ว อยู่ที่เดิมรอรอบนี้ได้เลย\nกลับที่พัก: รถไฟใต้ดินสาย 11 เที่ยวสุดท้ายจากสถานี Disney Resort ปกติคือ 22:30 แล้วหลังโชว์คิวสถานียาวมาก ถ้ายังไม่ยืนยันว่าคืนนั้นสาย 11 วิ่งดึก ใช้รอบ 20:00 เป็นรอบนับถอยหลังแทน หรือเผื่อเงินค่า Didi ราคาพุ่งไว้\n📸 ถ่ายวิดีโอแนวนอนตอนนับถอยหลังเปิดกันสั่นไว้ แล้วสลับเป็น Live Photo ตอนพลุเลขปีใหม่ขึ้น ให้ปราสาทอยู่กลางเฟรม ถ่ายเซลฟี่คู่ตอนพลุขึ้นด้วยนะ เอาไว้เทียบกับปีก่อน ๆ 🥂✨"],"confirm",""),
   I("21:40","travel",["Metro Line 11 back to Xintiandi","นั่งรถไฟใต้ดินสาย 11 กลับซินเทียนตี้"],
    ["After the 21:15 countdown show (~21:35), walk straight to Disney Resort station; expect long queues and crowd control. Line 11's normal last train toward the city is 22:30 (reaching Jiaotong University ~23:12), so check the NYE timetable (2025's late-running list didn't include Line 11). Change at Jiaotong University to Line 10 for Xintiandi, ~75 min, back at the Riverdale around 23:00–23:30. Didi from the West PTH is the fallback, with surge pricing and long lines.","หลังโชว์นับถอยหลังรอบ 21:15 (จบราว 21:35) เดินตรงไปสถานี Disney Resort เลย คิวยาวและมีจำกัดคนเข้า รถไฟสาย 11 เที่ยวสุดท้ายเข้าเมืองปกติคือ 22:30 (ถึงสถานี Jiaotong University ราว 23:12) เช็กตารางคืนส่งท้ายปีด้วย (ปี 2025 สาย 11 ไม่อยู่ในลิสต์วิ่งดึก) ต่อสาย 10 ที่ Jiaotong University ลงซินเทียนตี้ ราว 75 นาที ถึงที่พัก Riverdale ราว 23:00–23:30 ถ้าไม่ทันรถไฟ เรียก Didi จากจุด West PTH ได้ แต่ราคาพุ่งและคิวยาว"],"planned","")

   ["Flight MU543 (to confirm): PVG Terminal 1, 23:35 → Singapore Changi T3 05:25 on 2 Jan. Be at PVG by 21:00–21:30 at the latest (aim ~20:30 for a relaxed check-in on a holiday night); counters usually close 1 h before (to confirm with China Eastern).\nTo PVG: Didi from Xintiandi is about 45–60 min (roughly ¥150–200, to confirm). Or Metro to Longyang Road + Maglev (8 min, ¥50, or ¥40 with a same-day air ticket at the counter); the last Maglev leaves Longyang Road at 21:40, so it's only an option if you leave early.\n1 Jan is a public holiday. Ask the hotel to hold bags after check-out (to confirm), and use the relaxed day for brunch or a last stroll.\n⏰ Airport run: bags packed and ready by 19:15, Didi at 19:30. Last chance for 'one more photo' is 19:14 😘✈️","ปิดทริปเคานต์ดาวน์ปีที่ 4 แล้ว 🤍 ลอนดอน ญี่ปุ่น ปารีส และวินเทอร์แลนด์จีน ขากลับบนเครื่องมาช่วยกันเลือกรูปเด็ดของปีนี้กันนะ ปีหน้าไปไหนดี? 😉\nไฟลต์ MU543 (รอยืนยัน): สนามบินผู่ตง เทอร์มินัล 1 ออก 23:35 → ถึงชางงี สิงคโปร์ T3 05:25 เช้าวันที่ 2 ม.ค. ต้องถึง PVG อย่างช้า 21:00–21:30 (ถ้าไปถึงราว 20:30 จะชิลกว่า คืนวันหยุดคนเยอะ) เคาน์เตอร์มักปิดก่อนบิน 1 ชม. (รอยืนยันกับ China Eastern)\nไปสนามบิน PVG: Didi จากซินเทียนตี้ราว 45–60 นาที (ราว 150–200 หยวน รอยืนยัน) หรือรถไฟใต้ดินไปสถานี Longyang Road แล้วต่อรถไฟแม่เหล็ก Maglev (8 นาที 50 หยวน หรือ 40 หยวนถ้าโชว์ตั๋วเครื่องบินวันเดียวกันที่เคาน์เตอร์) Maglev เที่ยวสุดท้ายออกจาก Longyang Road 21:40 เลยใช้ได้ถ้าออกเร็วเท่านั้น\n1 ม.ค. เป็นวันหยุดราชการ ขอโรงแรมฝากกระเป๋าหลังเช็คเอาต์ (รอยืนยัน) แล้วใช้วันชิล ๆ ไปกินบรันช์หรือเดินเล่นรอบสุดท้าย\n⏰ ไปสนามบิน: แพ็กกระเป๋าและพร้อมภายใน 19:15 เรียก Didi 19:30 ขอถ่ายรูปอีกรูปได้ถึง 19:14 เท่านั้นนะ 😘✈️"],[

    ["— not booked yet, to confirm. Leave Xintiandi ~19:30 (Didi 45–60 min to PVG T1); be at the airport by 21:00–21:30 at the latest.","— ยังไม่ได้จอง รอยืนยันนะ ออกจากซินเทียนตี้ราว 19:30 (Didi ไป PVG T1 ราว 45–60 นาที) ต้องถึงสนามบินอย่างช้า 21:00–21:30"],"confirm","")

 ideas:[
   I(["Afternoon / evening","บ่าย ๆ ถึงค่ำ"],"shopping",["(Beijing) SKP & SKP-S (华贸SKP), Guomao","(ปักกิ่ง) ห้าง SKP & SKP-S (华贸SKP) ย่านกั๋วเม่า"],
    ["Why: Beijing's top luxury department store, and next door SKP-S is a sci-fi 'Mars' concept store by Gentle Monster with robot sheep and art installations, great for photos even if you buy nothing. Best: weekday afternoon into evening. Area: Guomao CBD, Chaoyang (Metro Line 1/10 Guomao), close to the Conrad. Hours about 10:00–22:00 (to confirm).","ทำไมต้องไป: ห้างหรูอันดับต้น ๆ ของปักกิ่ง ส่วน SKP-S ข้าง ๆ เป็นคอนเซ็ปต์สโตร์ธีม 'ดาวอังคาร' ของ Gentle Monster มีแกะหุ่นยนต์กับงานอาร์ตเต็มไปหมด ถ่ายรูปปังมากแม้ไม่ได้ช้อปสักชิ้น เวลาดีสุด: บ่ายวันธรรมดาลากยาวถึงค่ำ ย่าน: กั๋วเม่า (CBD) เขตเฉาหยาง รถไฟใต้ดินสาย 1/10 สถานี Guomao ใกล้ Conrad เปิดราว 10:00–22:00 (รอยืนยัน)\n📸 ช็อตเด็ด: แกะหุ่นยนต์ชั้น 1 ของ SKP-S ใส่ลุคโทนขาว/เทา/ดำ จะเข้ากับธีมอวกาศมาก"],"idea","https://www.youtube.com/shorts/IgQ7g1bv2Dk"),
   I(["Sunset ~16:30–17:15","ช่วงพระอาทิตย์ตก ~16:30–17:15"],"sightseeing",["(Beijing) Forbidden City Corner Tower at sunset (故宫角楼)","(ปักกิ่ง) หอมุมพระราชวังต้องห้ามยามพระอาทิตย์ตก (故宫角楼)"],
    ["Why: the classic Beijing postcard: the golden corner tower reflected in the moat, with red walls glowing at dusk. Free, it's outside the palace walls. Best: sunset, about 16:50 in late December; the northeast corner by Jingshan Front St is the favourite spot. Area: Dongcheng, ~10–15 min Didi from the Wangfujing apartment. Overlap: Day 2 is at the Forbidden City; this fits between the 15:00 rest and the 17:55 Didi to dinner.","ทำไมต้องไป: ภาพโปสการ์ดปักกิ่งของแท้ หอมุมสีทองสะท้อนในคูน้ำ กำแพงแดงเรืองแสงตอนเย็น ฟรีเพราะอยู่นอกกำแพงวัง เวลาดีสุด: ช่วงพระอาทิตย์ตก ปลายธันวาราว 16:50 มุมยอดฮิตคือมุมตะวันออกเฉียงเหนือฝั่งถนน Jingshan Front St ย่าน: ตงเฉิง นั่ง Didi จากอพาร์ตเมนต์หวังฟูจิ่งราว 10–15 นาที ทับกับวันไหน: วันที่ 2 ไปพระราชวังต้องห้ามอยู่แล้ว แวะได้ช่วงหลังพัก 15:00 ก่อนเรียก Didi ไปกินข้าว 17:55\n📸 ช็อตเด็ด: ยืนริมคูน้ำฝั่งตะวันออกเฉียงเหนือ ให้หอมุมกับเงาสะท้อนอยู่ครึ่งบนครึ่งล่างของเฟรม"],"idea","https://www.youtube.com/shorts/vNCd5r8cQdc"),
   I(["Half day, morning","ครึ่งวันช่วงเช้า"],"sightseeing",["(Beijing) Hanfu / Qing-style costume photoshoot (汉服旅拍)","(ปักกิ่ง) ถ่ายรูปชุดฮั่นฝู / ชุดชิง แบบซีรีส์จีน (汉服旅拍)"],
    ["Why: the viral Beijing experience: a studio does hair, makeup and costume, then a photographer shoots you outside the palace walls and gates, very C-drama princess. Best: a morning, book a studio a few days ahead (often via Xiaohongshu/Dianping or Trip.com); roughly ¥500–1,500 depending on the package (to confirm). Pro photographers can't shoot inside the Forbidden City itself, so shoots are outside or at spots like the moat (to confirm). Area: studios cluster near the Forbidden City / Shenwumen. Overlap: needs its own half-day; not scheduled yet.","ทำไมต้องไป: ประสบการณ์ไวรัลของปักกิ่ง ร้านทำผม แต่งหน้า แต่งชุดให้ครบ แล้วมีช่างภาพพาไปถ่ายรอบกำแพงและประตูวัง ฟีลเจ้าหญิงในซีรีส์จีนเลย เวลาดีสุด: ช่วงเช้า จองร้านล่วงหน้าสักสองสามวัน (มักจองผ่าน Xiaohongshu/Dianping หรือ Trip.com) ราคาราว 500–1,500 หยวนแล้วแต่แพ็กเกจ (รอยืนยัน) ช่างภาพมืออาชีพถ่ายในพระราชวังต้องห้ามไม่ได้ เลยถ่ายรอบนอกหรือริมคูน้ำ (รอยืนยัน) ย่าน: ร้านเช่าชุดอยู่แถวพระราชวังต้องห้าม / ประตูเสินอู่ ทับกับวันไหน: ต้องใช้ครึ่งวัน ยังไม่ได้ใส่ในแผน"],"idea","https://www.youtube.com/shorts/AJdd4MgoE3o"),
   I(["Daytime (galleries often shut Mon)","กลางวัน (แกลเลอรีมักปิดวันจันทร์)"],"sightseeing",["(Beijing) 798 Art District (798艺术区)","(ปักกิ่ง) ย่านศิลปะ 798 (798艺术区)"],
    ["Why: old Bauhaus-style factories turned into galleries, graffiti tunnels, cafés and indie design and gift shops: lots of cool photo walls and unique souvenirs. Best: late morning to afternoon; many galleries close on Mondays (to confirm per gallery). Area: Jiuxianqiao, Chaoyang (Metro Line 14 Jiangtai, ~10 min walk), ~20 min Didi from the Conrad.","ทำไมต้องไป: โรงงานเก่าสไตล์เบาเฮาส์ที่กลายเป็นแกลเลอรี อุโมงค์กราฟฟิตี คาเฟ่ และร้านดีไซน์/ของฝากอินดี้ มีมุมถ่ายรูปเท่ ๆ เพียบ ของฝากก็ไม่ซ้ำใคร เวลาดีสุด: สาย ๆ ถึงบ่าย แกลเลอรีหลายที่ปิดวันจันทร์ (รอยืนยันแต่ละที่) ย่าน: จิ่วเซียนเฉียว เขตเฉาหยาง (รถไฟใต้ดินสาย 14 สถานี Jiangtai เดินราว 10 นาที) นั่ง Didi จาก Conrad ราว 20 นาที"],"idea","https://www.youtube.com/shorts/vVC3MboTwSw"),
   I(["After dark, from 17:00","หลังมืด ตั้งแต่ 17:00"],"shopping",["(Beijing) The Place sky screen (世贸天阶)","(ปักกิ่ง) จอยักษ์บนฟ้าที่ The Place (世贸天阶)"],
    ["Why: a 250 m LED 'sky' canopy over the plaza with light shows overhead, fun for a look-up photo, plus an easy mall below (ZARA, MUJI, UNIQLO etc.). Best: after dark; in winter shows run about every 30 min from 17:00 to 22:00 (to confirm). Area: 9 Guanghua Rd, Chaoyang CBD (Metro Line 6 Dongdaqiao), ~10 min from the Conrad, easy to pair with SKP.","ทำไมต้องไป: จอ LED ยาว 250 เมตรเป็นหลังคาเหนือลานเดิน มีโชว์แสงสีอยู่บนหัว ถ่ายรูปแหงนหน้าสวยมาก ข้างล่างเป็นห้างช้อปง่าย ๆ (ZARA, MUJI, UNIQLO ฯลฯ) เวลาดีสุด: หลังมืด หน้าหนาวมีโชว์ราวทุก 30 นาที 17:00–22:00 (รอยืนยัน) ย่าน: 9 Guanghua Rd ย่าน CBD เฉาหยาง (รถไฟใต้ดินสาย 6 สถานี Dongdaqiao) ห่าง Conrad ราว 10 นาที ไปคู่กับ SKP ได้สบาย"],"idea","https://www.youtube.com/shorts/7Qvi4sIjvmU"),
   I(["Daytime","กลางวัน"],"sightseeing",["(Shanghai) Columbia Circle (上生·新所)","(เซี่ยงไฮ้) โคลัมเบียเซอร์เคิล (上生·新所)"],
    ["Why: a 1920s country club turned lifestyle park: Spanish-style villa, the photogenic old pool, red-brick lanes, cafés and small concept shops, very 'European Shanghai'. Free to wander. Best: daytime, good light late morning to mid-afternoon. Area: 1262 Yan'an Rd W, Changning, ~20–25 min Didi from Xintiandi. Not scheduled; could fill Day 7's open afternoon.","ทำไมต้องไป: คันทรีคลับยุค 1920 ที่กลายเป็นสวนไลฟ์สไตล์ มีวิลล่าสไตล์สเปน สระว่ายน้ำเก่าที่ถ่ายรูปสวยมาก ตรอกอิฐแดง คาเฟ่ และร้านคอนเซ็ปต์เล็ก ๆ ฟีลเซี่ยงไฮ้แบบยุโรป เดินเล่นฟรี เวลาดีสุด: กลางวัน แสงสวยช่วงสายถึงบ่ายแก่ ๆ ย่าน: 1262 Yan'an Rd W เขตฉางหนิง นั่ง Didi จากซินเทียนตี้ราว 20–25 นาที ยังไม่ได้ใส่ในแผน ใส่ในช่วงบ่ายว่างของวันที่ 7 ได้\n📸 ช็อตเด็ด: ริมสระว่ายน้ำเก่ากับวิลล่าสไตล์สเปน มาช่วงสายแดดนุ่ม ๆ"],"idea","https://www.youtube.com/shorts/16cZMbA3u9A"),
   I(["Afternoon into night","บ่ายลากยาวถึงค่ำ"],"shopping",["(Shanghai) IFC Mall & Lujiazui Circular Skywalk (国金中心 · 陆家嘴环形天桥)","(เซี่ยงไฮ้) ห้าง IFC & สะพานลอยวงกลมลู่เจียจุ่ย (国金中心 · 陆家嘴环形天桥)"],
    ["Why: Pudong's glossiest luxury mall, then step out onto the round skywalk for selfies under the Oriental Pearl Tower and the supertall towers, best when they light up. Best: late afternoon, stay for the lights after ~17:30. Area: Lujiazui, Pudong (Metro Line 2 Lujiazui, Line 14 to Lujiazui; ~20 min from Xintiandi). Not scheduled; could fill Day 7's open evening.","ทำไมต้องไป: ห้างหรูที่ดูแพงที่สุดฝั่งผู่ตง ช้อปเสร็จเดินออกไปสะพานลอยวงกลม เซลฟี่ใต้หอไข่มุกกับตึกระฟ้า สวยสุดตอนไฟเปิด เวลาดีสุด: บ่ายแก่ ๆ แล้วอยู่ดูไฟหลัง ~17:30 ย่าน: ลู่เจียจุ่ย ผู่ตง (รถไฟใต้ดินสาย 2 สถานี Lujiazui จากซินเทียนตี้ราว 20 นาที) ยังไม่ได้ใส่ในแผน ใส่ช่วงค่ำว่างของวันที่ 7 ได้\n📸 ช็อตเด็ด: บนสะพานวงกลม หันหน้าเข้าหอไข่มุกตอนไฟเพิ่งติด (ราว 17:15–17:45)"],"idea","https://www.youtube.com/shorts/JiS53xDU1VM"),
   I(["Late morning–afternoon","สาย ๆ ถึงบ่าย"],"shopping",["(Shanghai) Tianzifang lanes (田子坊)","(เซี่ยงไฮ้) ตรอกเถียนจื่อฟาง (田子坊)"],
    ["Why: a maze of old shikumen lanes packed with tiny boutiques, handmade jewellery, tea and souvenir shops and cafés: cute photos at every turn and easy small gifts. Best: late morning to afternoon on a weekday (crowded on weekends and evenings). Area: Taikang Rd, Huangpu (Metro Line 9 Dapuqiao), ~10 min Didi or 20 min walk from Xintiandi.","ทำไมต้องไป: ตรอกซอกซอยบ้านสือคู่เหมินเก่า ๆ เต็มไปด้วยร้านเล็ก ๆ เครื่องประดับแฮนด์เมด ร้านชา ของฝาก คาเฟ่ เดินไปมุมไหนก็ถ่ายรูปน่ารัก ซื้อของฝากชิ้นเล็กได้ง่าย เวลาดีสุด: สาย ๆ ถึงบ่ายวันธรรมดา (เสาร์อาทิตย์กับตอนค่ำคนแน่น) ย่าน: ถนน Taikang เขตหวงผู่ (รถไฟใต้ดินสาย 9 สถานี Dapuqiao) จากซินเทียนตี้นั่ง Didi ราว 10 นาที หรือเดิน 20 นาที"],"idea","https://www.youtube.com/shorts/nltxCGb7_L0"),
   I(["Daytime","กลางวัน"],"sightseeing",["(Shanghai) 1933 Old Millfun (1933老场坊)","(เซี่ยงไฮ้) 1933 Old Millfun (1933老场坊)"],
    ["Why: a 1930s Art Deco concrete building (once a slaughterhouse) with spiral ramps, 'air bridges' and light wells; a moody, very Instagram architecture shoot that few tourists know. Free to walk around. Best: daytime, sunny midday for the light shafts. Area: Shajing Rd, Hongkou (Metro Line 10 Hailun Rd ~10 min walk; ~20 min Didi from Xintiandi). Pair with Day 7's North Bund jog area.","ทำไมต้องไป: ตึกคอนกรีตอาร์ตเดโคยุค 1930 (เคยเป็นโรงฆ่าสัตว์) มีทางลาดวนเป็นเกลียว สะพานลอยในตึก และช่องแสง ถ่ายรูปฟีลเท่ ๆ ลึกลับ นักท่องเที่ยวรู้จักไม่เยอะ เดินชมฟรี เวลาดีสุด: กลางวัน เที่ยงแดดดีจะเห็นลำแสงสวยสุด ย่าน: ถนน Shajing เขตหงโข่ว (รถไฟใต้ดินสาย 10 สถานี Hailun Rd เดินราว 10 นาที นั่ง Didi จากซินเทียนตี้ราว 20 นาที) ไปคู่กับแถวนอร์ทบันด์ที่วิ่งเช้าวันที่ 7 ได้\n📸 ช็อตเด็ด: ยืนบนสะพานลอยในตึกแล้วถ่ายจากชั้นบนลงมา ให้เห็นทางลาดวนรอบตัว"],"idea","https://www.youtube.com/shorts/NPc2CuMwesA"),
   I(["Afternoon / evening","บ่าย ๆ ถึงค่ำ"],"shopping",["(Shanghai) TX Huaihai youth mall & Huaihai Rd (TX淮海 · 淮海中路)","(เซี่ยงไฮ้) ห้าง TX Huaihai & ถนนไหวไห่ (TX淮海 · 淮海中路)"],
    ["Why: Shanghai's trendiest 'youth culture' mall, with rotating pop-ups, art installations, designer-toy and streetwear shops and a light-up facade, then Huaihai Road's big flagships next door. Best: afternoon into evening. Area: 523 Huaihai Rd Middle (Metro Line 1/13 Huangpi Rd S / Xintiandi), a 5–10 min walk from the hotel, so easy for any free hour.","ทำไมต้องไป: ห้างสายวัยรุ่นที่ฮิปที่สุดในเซี่ยงไฮ้ มีป๊อปอัพหมุนเวียน งานอาร์ต ร้านอาร์ตทอย/สตรีทแวร์ ด้านหน้าตึกเปิดไฟสวย เดินต่อถนนไหวไห่ที่มีแฟลกชิปสโตร์เพียบ เวลาดีสุด: บ่ายถึงค่ำ ย่าน: 523 Huaihai Rd Middle (รถไฟใต้ดินสาย 1/13 สถานี South Huangpi Rd / Xintiandi) เดินจากโรงแรมแค่ 5–10 นาที ว่างชั่วโมงไหนก็แวะได้"],"idea","https://www.youtube.com/shorts/PR3GxRfK9MI"),
   I(["Sunset into the lights (~16:30–18:00)","ช่วงพระอาทิตย์ตกถึงไฟเปิด (~16:30–18:00)"],"sightseeing",["(Shanghai) The Lujiazui 'skyline reveal' escalator, Metro Exit 6 (陆家嘴站6号口)","(เซี่ยงไฮ้) บันไดเลื่อนวิวตึกระฟ้าลู่เจียจุ่ย ทางออก 6 สถานี Lujiazui (陆家嘴站6号口)"],
    ["Why: most likely the escalator she means, the viral 'most beautiful escalator in the world'. Leave Lujiazui Station (Line 2/14) by Exit 6, the exit nearest IFC Mall, and ride the outdoor escalator up to the Lujiazui Circular Skywalk (陆家嘴环形天桥). As you rise, the Oriental Pearl Tower and the 'three-piece set' (Shanghai Tower, SWFC, Jin Mao) open up in front of you. Free. Best: sunset (~16:55) into the tower lights (~17:30). It gets crowded, so go on a weekday. Quieter options are Exit 1 (Pearl Tower side) or Exit 8 (towards Jin Mao). Area: Lujiazui, Pudong, ~20 min by Metro from Xintiandi; pairs with the IFC & Skywalk idea. Not scheduled; could fill Day 7's open evening.","ทำไมต้องไป: น่าจะเป็นบันไดเลื่อนที่เธอพูดถึงแหละ บันไดเลื่อนไวรัล 'ที่สวยที่สุดในโลก' ออกจากสถานี Lujiazui (สาย 2/14) ทางออก 6 ทางออกที่ใกล้ห้าง IFC ที่สุด แล้วขึ้นบันไดเลื่อนกลางแจ้งไปสะพานลอยวงกลม (陆家嘴环形天桥) ระหว่างที่ลอยขึ้นไป หอไข่มุกกับตึกสามพี่น้อง (Shanghai Tower, SWFC, Jin Mao) จะค่อย ๆ โผล่ขึ้นมาตรงหน้าเลย ฟรี เวลาดีสุด: ช่วงพระอาทิตย์ตก (~16:55) ต่อยาวถึงไฟตึกเปิด (~17:30) คนเยอะ มาวันธรรมดาดีกว่า ถ้าอยากได้มุมคนน้อย ลองทางออก 1 (ฝั่งหอไข่มุก) หรือทางออก 8 (ไปทาง Jin Mao) ย่าน: ลู่เจียจุ่ย ผู่ตง นั่งรถไฟใต้ดินจากซินเทียนตี้ราว 20 นาที ไปคู่กับไอเดียห้าง IFC & สะพานวงกลมได้เลย ยังไม่ได้ใส่ในแผน ใส่ช่วงค่ำว่างของวันที่ 7 ได้\n📸 ช็อตเด็ด: ให้ Keith ยืนต่ำกว่าเธอสองสามขั้นแล้วถ่ายเงยขึ้น เธออยู่กลางเฟรมโดยมีตึกโผล่ขึ้นมาข้างหลัง อัดวิดีโอแนวตั้งตั้งแต่ตีนบันไดจนถึงบนสุดด้วยนะ ถ่ายไว เพราะคนต่อคิวเยอะ"],"idea","https://www.youtube.com/shorts/Qp11WPoJ9Cw"),
   I(["Late afternoon (~15:30–16:45)","บ่ายแก่ ๆ (~15:30–16:45)"],"sightseeing",["(Shanghai) Lujiazui Central Green (陆家嘴中心绿地)","(เซี่ยงไฮ้) สวนลู่เจียจุ่ย เซ็นทรัลกรีน (陆家嘴中心绿地)"],
    ["Why: the big park with a lawn and lake right by the Oriental Pearl Tower, ringed by the supertall towers. It's a calm spot for wide 'all the towers in one frame' shots without the skywalk crowds, and the old courtyard mansion inside (Chen Guichun's Old House, 陈桂春旧宅) makes a nice old-meets-new contrast. Free (hours to confirm). Best: late-afternoon light, then walk up to the skywalk for the lights. Area: next to the Oriental Pearl Tower, Lujiazui, Pudong, ~5 min walk from Lujiazui Station (Line 2/14). Pairs with the escalator idea. Not scheduled; could fill Day 7's open afternoon.","ทำไมต้องไป: สวนใหญ่ มีสนามหญ้ากับทะเลสาบ อยู่ติดหอไข่มุก ล้อมรอบด้วยตึกระฟ้า ได้มุมกว้างเก็บตึกครบทุกตึกในเฟรมเดียวแบบไม่ต้องเบียดคนบนสะพานลอย แถมข้างในมีบ้านโบราณแบบจีน (บ้านเก่าเฉินกุ้ยชุน 陈桂春旧宅) ได้ฟีลเก่าตัดใหม่ เข้าฟรี (เวลาเปิดรอยืนยัน) เวลาดีสุด: แสงบ่ายแก่ ๆ แล้วเดินขึ้นสะพานลอยรอดูไฟเปิดต่อ ย่าน: ข้างหอไข่มุก ลู่เจียจุ่ย ผู่ตง เดินจากสถานี Lujiazui (สาย 2/14) ราว 5 นาที ไปคู่กับไอเดียบันไดเลื่อนได้ ยังไม่ได้ใส่ในแผน ใส่ช่วงบ่ายว่างของวันที่ 7 ได้\n📸 ช็อตเด็ด: ยืนริมทะเลสาบให้ตึกสะท้อนน้ำ แล้วถ่ายแนวตั้งเก็บหอไข่มุกกับตึกสามพี่น้องในเฟรมเดียว ใส่เสื้อโค้ทสีสด ๆ จะเด้งกับฉากตึกเทา ๆ มาก"],"idea","https://www.youtube.com/shorts/eFOZCj4-2fs")
 ]
};

let lang="en";
try{ lang=localStorage.getItem(LANG_KEY)||((navigator.language||"").toLowerCase().startsWith("th")?"th":"en"); }catch(e){}
if(!LANGS.includes(lang)) lang="en";
const other=()=>lang==="en"?"th":"en";
const T=k=>STR[lang][k];

/* ---------- bilingual fields ---------- */
// Each text field f is stored as f_en and f_th; o.ed records which language fields the user typed in.
// Reading: the current language, falling back to the other one. Writing: the current language;
// the other language mirrors the edit unless the user has typed there too.
const tx=(o,f)=>{const a=o[f+"_"+lang], b=o[f+"_"+other()]; return a!=null&&a!==""?a:(b||"");};
function setTx(o,f,val){
  if(val===tx(o,f)) return false;
  o.ed=o.ed||{};
  o[f+"_"+lang]=val; o.ed[f+"_"+lang]=1;
  if(!o.ed[f+"_"+other()]) o[f+"_"+other()]=val;
  return true;
}
function setBoth(o,f,val){ o[f+"_en"]=val; o[f+"_th"]=val; }
// Build an English → Thai lookup from the original data so old saved plans (English-only) get Thai back.
const pair=v=>Array.isArray(v)?[String(v[0]),String(v[1])]:[String(v==null?"":v),String(v==null?"":v)];
const TH_LOOKUP={};
(function(){
  const add=(f,v)=>{const [en,th]=pair(v); if(!en) return; (TH_LOOKUP[f]=TH_LOOKUP[f]||{})[en]=th;};
  add("ptitle",ORIGINAL_DATA.title);
  const doItem=it=>ITEM_F.forEach(f=>add("i_"+f,it[f]));
  ORIGINAL_DATA.days.forEach(d=>{DAY_F.forEach(f=>add("d_"+f,d[f])); d.items.forEach(doItem);});
  ORIGINAL_DATA.ideas.forEach(doItem);
  if(typeof LEGACY_TH!=="undefined") Object.keys(LEGACY_TH).forEach(f=>LEGACY_TH[f].forEach(v=>{const L=TH_LOOKUP[f]=TH_LOOKUP[f]||{}; if(!(v[0] in L)) L[v[0]]=v[1];}));
})();
function normFields(src,fields,prefix){
  const out={}; const ed={};
  const srcEd=src.ed&&typeof src.ed==="object"?src.ed:{};
  fields.forEach(f=>{
    let en,th;
    if(src[f+"_en"]!=null||src[f+"_th"]!=null){ en=String(src[f+"_en"]??""); th=String(src[f+"_th"]??""); if(!en) en=th; if(!th) th=en; }
    else if(Array.isArray(src[f])){ [en,th]=pair(src[f]); }
    else { en=String(src[f]??""); const lk=TH_LOOKUP[prefix+f]; th=lk&&Object.prototype.hasOwnProperty.call(lk,en)?lk[en]:en; }
    out[f+"_en"]=en; out[f+"_th"]=th;
    LANGS.forEach(l=>{ if(srcEd[f+"_"+l]) ed[f+"_"+l]=1; });
  });
  out.ed=ed; return out;
}
// weather per day: [{city,city_en,city_th,src:"typical"|"forecast",icon,hi,lo,desc_en,desc_th,asof}] (object or list accepted)
function normWx(w){
  if(!w) return null; const L=(Array.isArray(w)?w:[w]).filter(x=>x&&typeof x==="object").map(x=>{
    const n=v=>v===""||v==null||!isFinite(Number(v))?null:Math.round(Number(v));
    return {city:String(x.city||""),city_en:String(x.city_en||""),city_th:String(x.city_th||x.city_en||""),src:x.src==="forecast"?"forecast":"typical",
      icon:String(x.icon||""),hi:n(x.hi),lo:n(x.lo),desc_en:String(x.desc_en||""),desc_th:String(x.desc_th||x.desc_en||""),asof:x.asof?String(x.asof):null};});
  return L.length?L:null;
}
function normalize(p){
  if(!p||typeof p!=="object"||!Array.isArray(p.days)) throw new Error("Not a trip plan file");
  const ni=it=>navFields(it,Object.assign({id:it.id||uid(),cat:CAT_EMO[it.cat]?it.cat:"other",status:STATUS_KEYS.includes(it.status)?it.status:"planned",link:String(it.link||"")},normFields(it,ITEM_F,"i_")));
  const pt=normFields(p,["title"],"p");
  // plan title lookup key differs
  if(p.title_en==null&&p.title_th==null&&!Array.isArray(p.title)){ const en=String(p.title||"Our Trip"); pt.title_en=en; pt.title_th=TH_LOOKUP.ptitle[en]||en; }
  return Object.assign({app:"china-trip-planner",version:2},pt,{
    days:p.days.map(d=>{const o=Object.assign({id:d.id||uid(),date:String(d.date||""),items:(d.items||[]).map(ni)},normFields(d,DAY_F,"d_")); const w=normWx(d.weather); if(w) o.weather=w; return o;}),
    ideas:(p.ideas||[]).map(ni),savedAt:p.savedAt||null}, (l=>l?{log:l}:{})(normLog(p.log)));
}
const original=()=>normalize(clone(ORIGINAL_DATA));

// Per item (all optional): zh (Chinese name, used as the Amap search keyword), zh_addr (Chinese address),

const NAV_F=["zh","zh_addr","zh_city"];
const SEED=typeof NAV_SEED!=="undefined"?NAV_SEED:{};
// copies the nav fields onto o, always at the end and in this order (sync compares plans as JSON)
function navFields(src,o){ NAV_F.forEach(f=>{ delete o[f]; if(src[f]!=null) o[f]=String(src[f]); }); delete o.nav; if(src.nav===false) o.nav=false; return pickFields(src,o); }
// co-planning picks per item: picks:{keith:{h:1,s:1},her:{h:1}} (h = ❤️ love it, s = ⭐ must-do); kept last, in a fixed order
const PICK_WHO=["keith","her"];
function pickFields(src,o){ delete o.picks; const p=src.picks;
  if(p&&typeof p==="object"){ const out={}; PICK_WHO.forEach(w=>{ const v=p[w]; if(v&&typeof v==="object"){ const r={}; if(v.h) r.h=1; if(v.s) r.s=1; if(r.h||r.s) out[w]=r; } }); if(Object.keys(out).length) o.picks=out; }
  return o; }
// plan-level changelog: [{id,ts,by:"keith"|"her"|"bot",a,item,t,th,d}] (a: add|edit|move|maybe|del|idea|heart|star; d = day id or "ideas"), capped
const LOG_CAP=60, LOG_BY=["keith","her","bot"];
function logEntry(x){ const o={id:String(x.id),ts:Number(x.ts)||0,by:LOG_BY.includes(x.by)?x.by:"bot",a:String(x.a||"edit"),item:String(x.item||"")};
  ["t","th","d"].forEach(k=>{ if(x[k]!=null&&x[k]!=="") o[k]=String(x[k]); }); return o; }
function normLog(l){ if(!Array.isArray(l)) return null;
  const L=l.filter(x=>x&&typeof x==="object"&&x.id).map(logEntry).sort((a,b)=>a.ts-b.ts).slice(-LOG_CAP); return L.length?L:null; }

const GENERIC=/\b(no plans?|free (time|day|afternoon|morning|evening)|tbd|to be planned|rest|relax|chill|inside the park|in the park|early (lunch|dinner)|warm up|return to|back to (the )?(hotel|apartment)|packing|check-?out)\b|ว่าง|ยังไม่มีแผน|พักผ่อน/i;
function navCity(it,day){
  const c=day?(day.city_en||"")+" "+(day.city_th||""):(it.title_en||"")+" "+(it.title_th||"");
  const bj=/beijing|ปักกิ่ง|北京/i.test(c), sh=/shanghai|เซี่ยงไฮ้|上海/i.test(c);
  return bj&&!sh?"北京":sh&&!bj?"上海":"";
}
// search keyword for a place with no Chinese name: the Chinese part of the title if any, else the title without "Lunch:" etc.
function navKeyword(t){
  t=String(t||"").replace(/^\s*\((beijing|shanghai|ปักกิ่ง|เซี่ยงไฮ้)\)\s*/i,"").trim();
  const runs=(t.match(/[0-9A-Za-z·]*[\u3400-\u9fff][\u3400-\u9fff0-9A-Za-z·]*/g)||[]).filter(r=>/[\u3400-\u9fff].*[\u3400-\u9fff]/.test(r));
  if(runs.length) return runs.sort((a,b)=>b.length-a.length)[0];
  return t.replace(/^(breakfast|brunch|lunch|dinner|supper|coffee|drinks|snacks?|dessert|visit|stay|check[- ]?in)\s*[:\-–]\s*/i,"").trim()||t;
}
function navInfo(it,day){
  let src=it;
  if(!("zh" in it)&&it.nav!==false&&SEED[it.title_en]) src=SEED[it.title_en]; // an older app copy may have dropped the fields
  if(src.nav===false) return null;
  const zh=String(src.zh||"").trim(), city=String(src.zh_city||"").trim()||navCity(it,day);
  if(zh) return {zh,addr:String(src.zh_addr||"").trim(),city,kw:zh,fallback:false};
  if(!NAV_CATS.includes(it.cat)) return null;
  const t=String(it.title_en||it.title_th||"").trim();
  if(!t||GENERIC.test(t)||GENERIC.test(it.title_th||"")) return null;
  return {zh:"",addr:"",city,kw:navKeyword(t),fallback:true};
}
// Amap URI API, search: https://lbs.amap.com/api/uri-api/guide/search/search (opens the Amap app when installed, else the web map)
const amapUrl=n=>"https://uri.amap.com/search?keyword="+encodeURIComponent(n.kw)+(n.city?"&city="+encodeURIComponent(ADCODE[n.city]||n.city):"")+"&src=china-trip-planner&callnative=1";
// Native Amap app links (高德地图手机版 URI docs):
//  iOS (iPhone + iPad):  iosamap://poi?sourceApplication=..&name=..[&lat1&lon1&lat2&lon2]&dev=0   https://lbs.amap.com/api/amap-mobile/guide/ios/search
//  Android:              androidamap://poi?sourceApplication=..&keywords=..[&lat1..]&dev=0, pkg com.autonavi.minimap
//                        https://lbs.amap.com/api/amap-mobile/guide/android/search ; sent as a Chrome intent:// URL with the web link as browser_fallback_url
// The bounds (top-left lat1/lon1, bottom-right lat2/lon2) keep the search inside the trip city.
const AMAP_SRC="china-trip-planner";
const AMAP_BOX={"北京":[41.06,115.42,39.44,117.51],"上海":[31.87,120.85,30.68,122.12]};
// "ios" | "android" | "inapp" (WeChat, LINE, Instagram…: schemes are blocked there, use the web link) | "desktop"
function navPlatform(ua,touch){
  ua=String(ua||""); touch=Number(touch)||0;
  if(/MicroMessenger|WeChat|\bLine\/|Instagram|FBAN|FBAV|FB_IAB|Messenger|Twitter|TikTok|musical_ly|Bytedance|Weibo|QQ\/|DingTalk|AlipayClient|XiaoHongShu|discover\//i.test(ua)) return "inapp";
  if(/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&touch>1)) return "ios"; // iPadOS 13+ Safari reports a Mac user agent
  if(/Android/i.test(ua)) return "android";
  return "desktop";
}
function amapNativeUrl(n,plat){
  const box=AMAP_BOX[n.city], b=box?`&lat1=${box[0]}&lon1=${box[1]}&lat2=${box[2]}&lon2=${box[3]}`:"";
  if(plat==="ios") return `iosamap://poi?sourceApplication=${AMAP_SRC}&name=${encodeURIComponent(n.kw)}${b}&dev=0`;
  if(plat==="android") return `intent://poi?sourceApplication=${AMAP_SRC}&keywords=${encodeURIComponent(n.kw)}${b}&dev=0#Intent;scheme=androidamap;package=com.autonavi.minimap;S.browser_fallback_url=${encodeURIComponent(amapUrl(n))};end`;
  return null;
}
// opens the Amap app; if the page is still on screen (and focused) after ~1.5 s (app not installed / blocked), opens the web map instead
let amapTimer=0;
function openAmap(n,env){
  env=env||{};
  const plat=navPlatform(env.ua!=null?env.ua:navigator.userAgent,env.touch!=null?env.touch:navigator.maxTouchPoints);
  const go=env.go||(u=>{ location.href=u; });
  const web=amapUrl(n), nat=amapNativeUrl(n,plat);
  if(!nat){ (env.openWeb||(u=>{ const w=window.open(u,"_blank"); if(w){ try{ w.opener=null; }catch(e){} } else location.href=u; }))(web); return {plat,url:web}; }
  clearTimeout(amapTimer);
  const cancel=()=>{ clearTimeout(amapTimer); amapTimer=0; off(); };
  const onVis=()=>{ if(document.hidden) cancel(); };
  const off=()=>{ document.removeEventListener("visibilitychange",onVis); window.removeEventListener("pagehide",cancel); };
  document.addEventListener("visibilitychange",onVis); window.addEventListener("pagehide",cancel);
  // a blur alone doesn't cancel: iOS blurs the page for its "Open in 高德地图?" / "address invalid" dialogs.
  // While the page has no focus we wait (up to ~10 s); if the app opened the page goes hidden and we stop.
  const focused=env.hasFocus||(()=>document.hasFocus());
  let tries=0;
  const fire=()=>{ if(document.hidden){ cancel(); return; }
    if(!focused()&&tries++<20){ amapTimer=setTimeout(fire,500); return; }
    off(); amapTimer=0; go(web); };
  amapTimer=setTimeout(fire,env.wait!=null?env.wait:1500);
  go(nat);
  return {plat,url:nat,fallback:web};
}

const NAV_STOP=new Set(["lunch","dinner","breakfast","brunch","with","from","this","that","taxi","didi","walk","street"]);
function samePlace(oldT,newT,zh){
  const core=String(zh||"").replace(/[(（].*$/,"").trim();
  if(core&&String(newT).includes(core)) return true;
  const w=s=>(String(s).toLowerCase().match(/[a-z]{4,}/g)||[]).filter(x=>!NAV_STOP.has(x));
  const a=w(oldT); if(!a.length) return false; const b=new Set(w(newT));
  return a.filter(x=>b.has(x)).length/a.length>=0.5;
}

    s.addEventListener("touchmove",e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); s.style.transform=dy?`translateY(${dy}px)`:""; },{passive:true});

let plan, undoStack=[];
function load(){
  try{const s=localStorage.getItem(STORE_KEY); if(s) return normalize(JSON.parse(s));}catch(e){console.warn("load failed",e)}
  return original();
}
function save(){
  plan.savedAt=new Date().toISOString();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(plan));}catch(e){console.warn("save failed",e)}
}
function snapshot(){undoStack.push(JSON.stringify(plan)); if(undoStack.length>40) undoStack.shift(); $("#bUndo").disabled=false;}
function commit(){save();render();Sync.edited();}
function undo(){
  if(!undoStack.length) return;
  plan=normalize(JSON.parse(undoStack.pop())); $("#bUndo").disabled=!undoStack.length; commit(); toast(T("tUndone"));
}

/* ---------- lookup helpers ---------- */
function listById(lid){ if(lid==="ideas") return plan.ideas; const d=plan.days.find(d=>d.id===lid); return d?d.items:null; }
function findItem(id){
  for(const d of plan.days){const i=d.items.findIndex(x=>x.id===id); if(i>=0) return {list:d.items,lid:d.id,idx:i,item:d.items[i]};}
  const i=plan.ideas.findIndex(x=>x.id===id); if(i>=0) return {list:plan.ideas,lid:"ideas",idx:i,item:plan.ideas[i]};
  return null;
}
function moveItem(id,toLid,toIdx){
  const f=findItem(id), to=listById(toLid); if(!f||!to) return false;
  f.list.splice(f.idx,1);
  if(toIdx==null||toIdx>to.length) toIdx=to.length; if(toIdx<0) toIdx=0;
  to.splice(toIdx,0,f.item); return true;
}
// style: "long" (Thursday, 24 Dec 2026 / วันพฤหัสบดีที่ 24 ธ.ค. 2026), "mid" (Thu 24 Dec / พฤ. 24 ธ.ค.), "short" (24 Dec / 24 ธ.ค.)
function fmtDate(iso,style){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso||"";
  const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d));
  const f=(loc,o)=>dt.toLocaleDateString(loc,Object.assign({timeZone:"UTC"},o));
  if(lang==="th"){
    const L="th-TH-u-ca-gregory";
    const wd=f(L,{weekday:style==="long"?"long":"short"}), mon=f(L,{month:"short"});
    if(style==="long") return `${wd}ที่ ${d} ${mon} ${y}`;
    if(style==="mid") return `${wd} ${d} ${mon}`;
    return `${d} ${mon}`;
  }
  if(style==="long") return f("en-GB",{weekday:"long",day:"numeric",month:"short",year:"numeric"});
  if(style==="mid") return f("en-GB",{weekday:"short",day:"numeric",month:"short"});
  return f("en-GB",{day:"numeric",month:"short"});
}
function addDaysIso(iso,n){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
  const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10);
}
function dayLabel(lid){ if(lid==="ideas") return T("ideas"); const i=plan.days.findIndex(d=>d.id===lid); const d=plan.days[i]; const c=tx(d,"city"); return `${T("dayN")(i+1)} · ${fmtDate(d.date,"mid")}${c?" · "+c:""}`; }

function openSheet(html,onMount){
  closeSheet();
  const bd=document.createElement("div"); bd.className="backdrop"; bd.id="sheet";
  bd.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bd.addEventListener("pointerdown",e=>{ if(e.target===bd) bd._down=true; });
  bd.addEventListener("click",e=>{ if(e.target===bd&&bd._down) closeSheet(); bd._down=false; });
  document.body.appendChild(bd); onMount&&onMount(bd.firstElementChild);
  const f=bd.querySelector("[autofocus]"); if(f&&matchMedia("(pointer:fine)").matches) f.focus();
}
