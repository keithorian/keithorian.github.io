<title>Our China Trip • Trip Planner</title>
<style>
:root{
  --bg:#faf6f0;--card:#fff;--ink:#2d2722;--muted:#7a6e64;--line:#eadfd2;
  --accent:#b5502f;--accent2:#e9a23b;--accent-soft:#fbe9df;
  --ok:#2f8a57;--ok-soft:#e3f4ea;--warn:#b97400;--warn-soft:#fff2d6;--idea:#7a55b8;--idea-soft:#efe8fa;
  --radius:14px;--shadow:0 1px 2px rgba(60,40,20,.08),0 2px 8px rgba(60,40,20,.06);
  font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Sukhumvit Set","Thonburi","Noto Sans Thai","Leelawadee UI","Leelawadee","Tahoma","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header{background:linear-gradient(135deg,#b5502f,#d9783e);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.jump{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#a9472a,#cf6e38);padding:8px 14px 0;box-shadow:0 2px 10px rgba(120,50,20,.25)}
.titlerow{display:flex;align-items:center;gap:8px}
#title{flex:1;min-width:0;background:transparent;border:0;border-radius:8px;color:#fff;font-size:20px;font-weight:700;padding:6px 6px;
  text-overflow:ellipsis}
.lang{flex:none;display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:#fff;font-weight:700;font-size:14px;border-radius:999px;padding:6px 12px;min-height:36px;min-width:48px}
.lang button[aria-pressed=true]{background:#fff;color:var(--accent)}
:lang(th) .ctitle,:lang(th) .dtitle{line-height:1.4}
#title:focus{background:rgba(255,255,255,.18);outline:none}
.tools{display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:rgba(255,255,255,.18);
  color:#fff;padding:8px 13px;font-size:14px;font-weight:500;min-height:38px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.28)}
.tbtn.primary{background:#fff;color:var(--accent)}
.tbtn:disabled{opacity:.45;cursor:default}
.tbtn.spin::first-letter{display:inline-block}
.sync{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:12px;color:rgba(255,255,255,.92);padding:0 2px 8px;min-height:18px}
.sdot{width:8px;height:8px;border-radius:50%;background:#9be3b4;flex:none}
.sync[data-s=saving] .sdot,.sync[data-s=checking] .sdot{background:#ffd27a}
.sync[data-s=offline] .sdot{background:#ff9d8a}
#stime,#sauto{opacity:.8}
#sauto{flex-basis:100%;padding-left:14px}
#stime:not(:empty)::before{content:"· "}
.ver{margin-top:12px;font-size:12px;color:var(--muted)}
.foot{text-align:center;margin:0 0 18px;padding:0 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:10px;background:rgba(0,0,0,.14);color:#fff;padding:5px 10px;font-size:12.5px;line-height:1.2;text-align:left}
.chip b{display:block;font-size:13px}
.chip:hover{background:rgba(0,0,0,.24)}

@media (max-width:480px){#title{font-size:17px}.lang button{min-width:42px;padding:6px 10px}}
/* board */
#board{display:flex;flex-direction:column;gap:14px;padding:14px;max-width:640px;margin:0 auto}
.day{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;scroll-margin-top:70px}
.day.ideas{background:#fffdf8;border:2px dashed #e6cfa9}
.dhead{padding:12px 12px 8px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;cursor:pointer;border-radius:var(--radius) var(--radius) 0 0}
.dhead:hover{background:#fdf9f4}
.dnum{flex:none;width:46px;border-radius:10px;background:var(--accent-soft);color:var(--accent);text-align:center;padding:5px 0;line-height:1.1}
.dnum small{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.dnum b{font-size:19px}
.ideas .dnum{background:#fff1d6;color:#a26a00;font-size:22px;padding:8px 0}
.dinfo{flex:1;min-width:0}
.dinfo .date{font-size:12.5px;color:var(--muted);font-weight:500}
.dinfo .dtitle{font-size:16px;font-weight:700;margin:1px 0 4px;line-height:1.25}
.city{display:inline-block;font-size:11.5px;font-weight:600;background:#f3ece3;color:#6a5a4b;border-radius:999px;padding:2px 8px;margin-right:4px}
.stay{display:inline-block;font-size:12px;color:var(--muted)}
.ibtn{flex:none;border:0;background:transparent;border-radius:10px;width:38px;height:38px;font-size:18px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{background:#f3ece3;color:var(--ink)}
.tips{margin:8px 12px 0;background:#fff8e6;border-radius:10px;font-size:13px;color:#6b5320}
.tips summary{cursor:pointer;padding:7px 10px;font-weight:600;list-style:none}
.tips summary::-webkit-details-marker{display:none}
.tips p{margin:0;padding:0 10px 9px;white-space:pre-wrap;line-height:1.4}
.list{list-style:none;margin:0;padding:8px 10px 4px;min-height:56px;display:flex;flex-direction:column;gap:8px}
.list:empty::before{content:attr(data-empty);display:block;text-align:center;color:#b8aa9b;font-size:13px;padding:14px;border:2px dashed var(--line);border-radius:10px}
.addbtn{margin:2px 10px 10px;border:0;border-radius:10px;background:transparent;color:var(--accent);font-weight:600;padding:10px;text-align:left;min-height:44px;font-size:14.5px}
.addbtn:hover{background:var(--accent-soft)}
.addday{border:2px dashed #e3cdb8;background:transparent;border-radius:var(--radius);color:var(--accent);font-weight:700;padding:18px;font-size:15px;min-height:60px}
.addday:hover{background:var(--accent-soft)}

/* cards */
.card{position:relative;display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,#ccc);
  border-radius:11px;box-shadow:0 1px 2px rgba(0,0,0,.04);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.card:hover{border-color:#dccbb8;border-left-color:var(--c)}
.card[data-cat=sightseeing]{--c:#d9783e}.card[data-cat=food]{--c:#d24d57}.card[data-cat=travel]{--c:#3a7bd5}
.card[data-cat=hotel]{--c:#7a55b8}.card[data-cat=shopping]{--c:#2fa08a}.card[data-cat=other]{--c:#9a8f84}
.handle{flex:none;width:30px;border:0;background:transparent;color:#c2b5a7;font-size:17px;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;border-radius:8px 0 0 8px;padding:0}
.handle:hover,.handle:focus-visible{color:var(--accent);background:#fbf3ec}
.cbody{flex:1;min-width:0;padding:9px 10px 9px 2px;cursor:pointer}
.ctop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:2px}
.ctime{font-weight:600;color:#5c5047}
.ctitle{font-size:14.5px;font-weight:600;line-height:1.3;word-wrap:break-word}
.cemo{margin-right:4px}
.cnotes{font-size:12.8px;color:var(--muted);line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.clink{display:inline-block;margin-top:4px;font-size:12.5px;color:#3a7bd5;text-decoration:none;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;text-transform:uppercase;letter-spacing:.03em}
.pill.booked{background:var(--ok-soft);color:var(--ok)}
.pill.confirm{background:var(--warn-soft);color:var(--warn)}
.pill.idea{background:var(--idea-soft);color:var(--idea)}
.card.dragging-src{opacity:.35;border-style:dashed}
.ghost{position:fixed;z-index:1000;pointer-events:none;box-shadow:0 12px 30px rgba(60,30,10,.28);transform:rotate(2deg) scale(1.02);opacity:.96;margin:0}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.dragging .card,body.dragging .cbody{cursor:grabbing}
.list.over{background:#fff6ee;border-radius:10px}
.card.lifting{transform:scale(1.02);box-shadow:0 6px 18px rgba(0,0,0,.15);transition:transform .15s}

/* desktop columns */
@media (min-width:900px){
  #board{flex-direction:row;align-items:flex-start;max-width:none;overflow-x:auto;padding:16px 16px 28px;min-height:calc(100vh - 140px);scroll-snap-type:x proximity}
  .day,.addday{flex:none;width:300px;scroll-snap-align:start;scroll-margin-left:16px}
  .day{max-height:none}
  .addday{height:120px}
  header,.jump{padding-left:20px;padding-right:20px}
  #title{font-size:22px}
}

/* sheet / modal */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(40,25,15,.42);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:600px){.backdrop{align-items:center}.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;justify-content:space-between}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px;font-size:16px;background:#fff}
.field textarea{min-height:90px;resize:vertical;line-height:1.4}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;min-height:40px}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;font-size:15px;min-height:46px;background:#f3ece3}
.btn.primary{background:var(--accent);color:#fff;flex:1}
.btn.danger{background:#fdeaea;color:#b3261e}
.btn:hover{filter:brightness(.97)}
.movebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#faf6f0;border-radius:12px;padding:8px}
.movebar select{flex:1;min-width:140px;border:1.5px solid var(--line);border-radius:9px;padding:8px;font-size:15px;background:#fff}
.movebar .btn{min-height:40px;padding:8px 12px}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 10px}
.x{border:0;background:#f3ece3;border-radius:50%;width:34px;height:34px;font-size:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);z-index:80;
  background:#2d2722;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .25s;max-width:calc(100vw - 24px)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{border:0;background:#e9a23b;color:#2d2722;font-weight:700;border-radius:8px;padding:7px 12px}
.firsthelp{max-width:640px;margin:12px auto 0;padding:0 14px}
.firsthelp div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:#5c5047;display:flex;gap:10px;align-items:center}
.firsthelp button{margin-left:auto}
@media (min-width:900px){.firsthelp{max-width:none;margin:12px 16px 0;padding:0}}

/* print */
@media print{
  @page{margin:12mm}
  header{position:static;background:none;color:#000;box-shadow:none;padding:0}
  #title{color:#000;font-size:22px;padding:0}
  .tools,.sync,.jump,.chips,.handle,.ibtn,.addbtn,.addday,#toast,.firsthelp,.backdrop{display:none!important}
  body{background:#fff}
  #board{display:block;padding:0;max-width:none;overflow:visible}
  .day{box-shadow:none;margin:0 0 10px;border:1px solid #ccc;width:auto}
  .dhead,.tips{break-after:avoid;page-break-after:avoid}
  .day.ideas.empty{display:none}
  .card{break-inside:avoid;box-shadow:none}
  .cnotes{-webkit-line-clamp:unset;display:block}
  .tips[open] p,.tips p{display:block}
  .clink::after{content:" (" attr(href) ")";color:#555;white-space:normal}
  .clink{white-space:normal}
}
</style>

let lang="en";
try{ lang=localStorage.getItem(LANG_KEY)||((navigator.language||"").toLowerCase().startsWith("th")?"th":"en"); }catch(e){}
if(!LANGS.includes(lang)) lang="en";
const other=()=>lang==="en"?"th":"en";
const T=k=>STR[lang][k];

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- bilingual fields ---------- */
// Each text field f is stored as f_en and f_th; o.ed records which language fields the user typed in.
// Reading: the current language, falling back to the other one. Writing: the current language;
// the other language mirrors the edit unless the user has typed there too.
const tx=(o,f)=>{const a=o[f+"_"+lang], b=o[f+"_"+other()]; return a!=null&&a!==""?a:(b||"");};
function setTx(o,f,val){
  if(val===tx(o,f)) return false;
  o.ed=o.ed||{};
  o[f+"_"+lang]=val; o.ed[f+"_"+lang]=1;
  if(!o.ed[f+"_"+other()]) o[f+"_"+other()]=val;
  return true;
}
function setBoth(o,f,val){ o[f+"_en"]=val; o[f+"_th"]=val; }
// Build an English → Thai lookup from the original data so old saved plans (English-only) get Thai back.
const pair=v=>Array.isArray(v)?[String(v[0]),String(v[1])]:[String(v==null?"":v),String(v==null?"":v)];
const TH_LOOKUP={};
(function(){
  const add=(f,v)=>{const [en,th]=pair(v); (TH_LOOKUP[f]=TH_LOOKUP[f]||{})[en]=th;};
  add("ptitle",ORIGINAL_DATA.title);
  const doItem=it=>ITEM_F.forEach(f=>add("i_"+f,it[f]));
  ORIGINAL_DATA.days.forEach(d=>{DAY_F.forEach(f=>add("d_"+f,d[f])); d.items.forEach(doItem);});
  ORIGINAL_DATA.ideas.forEach(doItem);
})();
function normFields(src,fields,prefix){
  const out={}; const ed={};
  const srcEd=src.ed&&typeof src.ed==="object"?src.ed:{};
  fields.forEach(f=>{
    let en,th;
    if(src[f+"_en"]!=null||src[f+"_th"]!=null){ en=String(src[f+"_en"]??""); th=String(src[f+"_th"]??""); if(!en) en=th; if(!th) th=en; }
    else if(Array.isArray(src[f])){ [en,th]=pair(src[f]); }
    else { en=String(src[f]??""); const lk=TH_LOOKUP[prefix+f]; th=lk&&Object.prototype.hasOwnProperty.call(lk,en)?lk[en]:en; }
    out[f+"_en"]=en; out[f+"_th"]=th;
    LANGS.forEach(l=>{ if(srcEd[f+"_"+l]) ed[f+"_"+l]=1; });
  });
  out.ed=ed; return out;
}
function normalize(p){
  if(!p||typeof p!=="object"||!Array.isArray(p.days)) throw new Error("Not a trip plan file");
  const ni=it=>Object.assign({id:it.id||uid(),cat:CAT_EMO[it.cat]?it.cat:"other",status:STATUS_KEYS.includes(it.status)?it.status:"planned",link:String(it.link||"")},normFields(it,ITEM_F,"i_"));
  const pt=normFields(p,["title"],"p");
  // plan title lookup key differs
  if(p.title_en==null&&p.title_th==null&&!Array.isArray(p.title)){ const en=String(p.title||"Our Trip"); pt.title_en=en; pt.title_th=TH_LOOKUP.ptitle[en]||en; }
  return Object.assign({app:"china-trip-planner",version:2},pt,{
    days:p.days.map(d=>Object.assign({id:d.id||uid(),date:String(d.date||""),items:(d.items||[]).map(ni)},normFields(d,DAY_F,"d_"))),
    ideas:(p.ideas||[]).map(ni),savedAt:p.savedAt||null});
}
const original=()=>normalize(clone(ORIGINAL_DATA));

let plan, undoStack=[];
function load(){
  try{const s=localStorage.getItem(STORE_KEY); if(s) return normalize(JSON.parse(s));}catch(e){console.warn("load failed",e)}
  return original();
}
function save(){
  plan.savedAt=new Date().toISOString();
  try{localStorage.setItem(STORE_KEY,JSON.stringify(plan));}catch(e){console.warn("save failed",e)}
}
function snapshot(){undoStack.push(JSON.stringify(plan)); if(undoStack.length>40) undoStack.shift(); $("#bUndo").disabled=false;}
function commit(){save();render();Sync.edited();}
function undo(){
  if(!undoStack.length) return;
  plan=normalize(JSON.parse(undoStack.pop())); $("#bUndo").disabled=!undoStack.length; commit(); toast(T("tUndone"));
}

/* ---------- lookup helpers ---------- */
function listById(lid){ if(lid==="ideas") return plan.ideas; const d=plan.days.find(d=>d.id===lid); return d?d.items:null; }
function findItem(id){
  for(const d of plan.days){const i=d.items.findIndex(x=>x.id===id); if(i>=0) return {list:d.items,lid:d.id,idx:i,item:d.items[i]};}
  const i=plan.ideas.findIndex(x=>x.id===id); if(i>=0) return {list:plan.ideas,lid:"ideas",idx:i,item:plan.ideas[i]};
  return null;
}
function moveItem(id,toLid,toIdx){
  const f=findItem(id), to=listById(toLid); if(!f||!to) return false;
  f.list.splice(f.idx,1);
  if(toIdx==null||toIdx>to.length) toIdx=to.length; if(toIdx<0) toIdx=0;
  to.splice(toIdx,0,f.item); return true;
}
// style: "long" (Thursday, 24 Dec 2026 / วันพฤหัสบดีที่ 24 ธ.ค. 2026), "mid" (Thu 24 Dec / พฤ. 24 ธ.ค.), "short" (24 Dec / 24 ธ.ค.)
function fmtDate(iso,style){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso||"";
  const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d));
  const f=(loc,o)=>dt.toLocaleDateString(loc,Object.assign({timeZone:"UTC"},o));
  if(lang==="th"){
    const L="th-TH-u-ca-gregory";
    const wd=f(L,{weekday:style==="long"?"long":"short"}), mon=f(L,{month:"short"});
    if(style==="long") return `${wd}ที่ ${d} ${mon} ${y}`;
    if(style==="mid") return `${wd} ${d} ${mon}`;
    return `${d} ${mon}`;
  }
  if(style==="long") return f("en-GB",{weekday:"long",day:"numeric",month:"short",year:"numeric"});
  if(style==="mid") return f("en-GB",{weekday:"short",day:"numeric",month:"short"});
  return f("en-GB",{day:"numeric",month:"short"});
}
function addDaysIso(iso,n){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return "";
  const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d+n)); return dt.toISOString().slice(0,10);
}

/* ---------- pointer drag & drop (mouse + touch + pen) ---------- */
let drag=null, pending=null, dragJustEnded=false, raf=0;
board.addEventListener("pointerdown",e=>{
  if(e.button>0) return;
  const card=e.target.closest(".card"); if(!card||e.target.closest("a")) return;
  const onHandle=!!e.target.closest(".handle");
  pending={card,id:card.dataset.id,x:e.clientX,y:e.clientY,pid:e.pointerId,type:e.pointerType,onHandle,timer:0};
  if(e.pointerType!=="mouse"&&!onHandle){
    pending.timer=setTimeout(()=>{ if(pending){ if(navigator.vibrate) try{navigator.vibrate(15)}catch(_){} startDrag(pending.x,pending.y); } },380);
  }
  if(onHandle) e.preventDefault();
});
window.addEventListener("pointermove",e=>{
  if(drag){ if(e.pointerId!==drag.pid) return; e.preventDefault(); drag.x=e.clientX; drag.y=e.clientY; positionGhost(); hitTest(); return; }
  if(!pending||e.pointerId!==pending.pid) return;
  const dist=Math.hypot(e.clientX-pending.x,e.clientY-pending.y);
  if(pending.type==="mouse"||pending.onHandle){ if(dist>4) startDrag(e.clientX,e.clientY); }
  else if(dist>10){ clearTimeout(pending.timer); pending=null; }
  if(pending){pending.x=e.clientX;pending.y=e.clientY;}
},{passive:false});
document.addEventListener("touchmove",e=>{ if(drag) e.preventDefault(); },{passive:false});
document.addEventListener("contextmenu",e=>{ if(drag||(pending&&pending.type!=="mouse")) e.preventDefault(); });
window.addEventListener("pointerup",e=>endPointer(e,false));
window.addEventListener("pointercancel",e=>endPointer(e,true));
function endPointer(e,cancel){
  if(pending){ clearTimeout(pending.timer); pending=null; }
  if(!drag||e.pointerId!==drag.pid) return;
  finishDrag(cancel);
}
function startDrag(x,y){
  const p=pending; pending=null; clearTimeout(p.timer);
  const card=p.card, r=card.getBoundingClientRect();
  const ghost=card.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width=r.width+"px"; ghost.removeAttribute("data-id");
  document.body.appendChild(ghost);
  card.classList.add("dragging-src"); document.body.classList.add("dragging");
  drag={id:p.id,card,ghost,pid:p.pid,x,y,offX:x-r.left,offY:y-r.top,fromLid:card.parentElement.dataset.lid,fromIdx:[...card.parentElement.children].indexOf(card)};
  positionGhost(); raf=requestAnimationFrame(autoScroll);
}
function positionGhost(){ drag.ghost.style.left=(drag.x-drag.offX)+"px"; drag.ghost.style.top=(drag.y-drag.offY)+"px"; }
function hitTest(){
  const el=document.elementFromPoint(drag.x,drag.y); if(!el) return;
  let list=el.closest(".list");
  if(!list){ const day=el.closest(".day"); if(day) list=day.querySelector(".list"); }
  if(!list) return;
  document.querySelectorAll(".list.over").forEach(l=>l!==list&&l.classList.remove("over")); list.classList.add("over");
  const siblings=[...list.children].filter(c=>c!==drag.card);
  let before=null;
  for(const c of siblings){ const r=c.getBoundingClientRect(); if(drag.y<r.top+r.height/2){before=c;break;} }
  if(before){ if(drag.card.nextElementSibling!==before||drag.card.parentElement!==list) list.insertBefore(drag.card,before); }
  else if(list.lastElementChild!==drag.card) list.appendChild(drag.card);
}
function autoScroll(){
  if(!drag) return;
  const edge=60, vh=window.innerHeight, vw=window.innerWidth, sp=(d)=>Math.ceil((edge-d)/edge*18);
  const hdr=Math.max(0,document.querySelector(".jump").getBoundingClientRect().bottom);
  let moved=false;
  if(drag.y<hdr+edge&&window.scrollY>0){ window.scrollBy(0,-sp(drag.y-hdr)); moved=true; }
  else if(drag.y>vh-edge){ window.scrollBy(0,sp(vh-drag.y)); moved=true; }
  if(board.scrollWidth>board.clientWidth){
    if(drag.x<edge){ board.scrollLeft-=sp(drag.x); moved=true; } else if(drag.x>vw-edge){ board.scrollLeft+=sp(vw-drag.x); moved=true; }
  }
  if(moved) hitTest();
  raf=requestAnimationFrame(autoScroll);
}
function finishDrag(cancel){
  cancelAnimationFrame(raf);
  const d=drag; drag=null;
  d.ghost.remove(); d.card.classList.remove("dragging-src"); document.body.classList.remove("dragging");
  document.querySelectorAll(".list.over").forEach(l=>l.classList.remove("over"));
  dragJustEnded=true; setTimeout(()=>dragJustEnded=false,50);
  const list=d.card.parentElement; const toLid=list&&list.dataset.lid; const toIdx=list?[...list.children].indexOf(d.card):-1;
  if(cancel||!toLid||(toLid===d.fromLid&&toIdx===d.fromIdx)){ render(); return; }
  snapshot(); moveItem(d.id,toLid,toIdx); commit();
  if(toLid!==d.fromLid) toast(T("tMoved")(dayLabel(toLid)),true);
}

const b64u={enc:bytes=>{let s="";for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");},
  dec:str=>{str=str.replace(/-/g,"+").replace(/_/g,"/"); while(str.length%4) str+="="; const bin=atob(str); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u;}};
async function streamBytes(bytes,ts){ const s=new Blob([bytes]).stream().pipeThrough(ts); return new Uint8Array(await new Response(s).arrayBuffer()); }
const shareable=()=>{const p=clone(plan); delete p.savedAt; return p;};
async function encodePlan(p){
  const bytes=new TextEncoder().encode(JSON.stringify(p));
  if(typeof CompressionStream==="function"){ try{ return "z="+b64u.enc(await streamBytes(bytes,new CompressionStream("deflate-raw"))); }catch(e){} }
  return "j="+b64u.enc(bytes);
}
async function decodePlan(hash){
  const m=String(hash).replace(/^.*#/,"").match(/(?:^|&)([zj])=([A-Za-z0-9_-]+)/); if(!m) return null;
  let bytes=b64u.dec(m[2]);
  if(m[1]==="z"){ if(typeof DecompressionStream!=="function") throw new Error(T("tNoDecomp")); bytes=await streamBytes(bytes,new DecompressionStream("deflate-raw")); }
  return normalize(JSON.parse(new TextDecoder().decode(bytes)));
}
async function shareLink(){ return location.href.split("#")[0]+"#"+await encodePlan(shareable()); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  let ok=false; try{ok=document.execCommand("copy");}catch(e){} ta.remove(); return ok;
}
function planBlob(){ return new Blob([JSON.stringify(shareable(),null,2)],{type:"application/json"}); }
function fileName(){ const d=new Date(); const p=n=>String(n).padStart(2,"0"); return `china-trip-plan-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`; }
function download(){ const a=document.createElement("a"); a.href=URL.createObjectURL(planBlob()); a.download=fileName(); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast(T("tDownloaded")); }
$("#bDownload").onclick=download;
$("#bShare").onclick=()=>{
  openSheet(`<h2>${T("shareH")}${closeX()}</h2>
    <p class="hint">${T("shareHint")}</p>
    <div class="actions" style="flex-direction:column">
      <button class="btn primary" type="button" data-copy>${T("copyLink")}</button>
      <button class="btn" type="button" data-file>${T("sendFile")}</button>
    </div>
    <p class="hint" style="margin-top:12px">${T("shareTip")}</p>`,
  s=>{
    s.querySelector("[data-x]").onclick=closeSheet;
    s.querySelector("[data-copy]").onclick=async()=>{ const l=await shareLink(); const ok=await copyText(l); closeSheet(); toast(ok?T("tCopied"):T("tNoCopy")); window.__lastShareLink=l; };
    s.querySelector("[data-file]").onclick=async()=>{
      const f=new File([planBlob()],fileName(),{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ try{ await navigator.share({files:[f],title:tx(plan,"title"),text:T("shareText")}); closeSheet(); return; }catch(e){ if(e.name==="AbortError") return; } }
      closeSheet(); download();
    };
  });
};
$("#bLoad").onclick=()=>{
  openSheet(`<h2>${T("loadH")}${closeX()}</h2>
   <p class="hint">${T("loadHint")}</p>
   <div class="actions" style="margin-top:0"><button class="btn primary" type="button" data-pick>${T("pick")}</button></div>
   <label class="field" style="margin-top:14px"><span>${T("pasteLink")}</span><input name="link" placeholder="https://…#z=…"></label>
   <div class="actions"><button class="btn" type="button" data-go>${T("loadLink")}</button></div>`,
  s=>{
    s.querySelector("[data-x]").onclick=closeSheet;
    s.querySelector("[data-pick]").onclick=()=>$("#fileIn").click();
    s.querySelector("[data-go]").onclick=async()=>{ try{ const p=await decodePlan(s.querySelector("[name=link]").value.trim()); if(!p) throw new Error(T("tBadLink")); closeSheet(); replacePlan(p,T("tLoadedLink")); }catch(e){ toast(e.message||T("tBadLink2")); } };
  });
};
$("#fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const p=normalize(JSON.parse(await f.text())); closeSheet(); replacePlan(p,T("tLoaded")); }catch(err){ toast(T("tBadFile")); }
});
function replacePlan(p,msg){ snapshot(); plan=p; commit(); toast(msg,true); }
$("#bPrint").onclick=()=>{ document.querySelectorAll(".tips").forEach(t=>t.open=true); setTimeout(()=>window.print(),50); };
$("#bReset").onclick=()=>confirmBox(T("resetH"),T("resetMsg"),T("resetOk"),()=>{replacePlan(original(),T("tReset"));},true);
$("#bUndo").onclick=undo;
$("#bHelp").onclick=()=>openSheet(`<h2>${T("helpH")}${closeX()}</h2>
  <p class="hint">${T("helpBody")}</p>
  <p class="ver" id="verInfo">${T("verLbl")}: ${esc(BUILD.label)}</p>
  <div class="actions"><button class="btn primary" type="button" data-x>${T("gotit")}</button></div>`,s=>s.querySelectorAll("[data-x]").forEach(b=>b.onclick=closeSheet));
$("#hideHelp").onclick=()=>{ $("#firsthelp").hidden=true; try{localStorage.setItem(HELP_KEY,"1")}catch(e){} };
window.addEventListener("beforeprint",()=>document.querySelectorAll(".tips").forEach(t=>t.open=true));
window.addEventListener("storage",e=>{ if(e.key===STORE_KEY&&e.newValue){ try{plan=normalize(JSON.parse(e.newValue)); render();}catch(_){} } });

/* ---------- shared online copy (sync) ---------- */
// One shared JSON document on textdb.dev, keyed by an unguessable id. Last write wins.
// Shared doc: {app,rev,by,plan}. rev = time (ms) of the edit it contains.
// Local meta: {rev: rev of the shared copy this device last synced with, dirty: unsynced local edits, editedAt}.
const Sync=(function(){
  const META_KEY="chinaTripPlanner.sync", ID_KEY="chinaTripPlanner.syncId", DEV_KEY="chinaTripPlanner.device", FLASH_KEY="chinaTripPlanner.flash";
  let id=BUILD.syncId;
  try{ const m=location.hash.match(/[#&]s=([A-Za-z0-9_-]{8,80})/); if(m){ id=m[1]; localStorage.setItem(ID_KEY,id); } else id=localStorage.getItem(ID_KEY)||id; }catch(e){}
  const url=()=>BUILD.endpoint+encodeURIComponent(id);
  let dev; try{ dev=localStorage.getItem(DEV_KEY); if(!dev){ dev=uid(); localStorage.setItem(DEV_KEY,dev);} }catch(e){ dev=uid(); }
  let meta={rev:0,dirty:false,editedAt:0};
  try{ const m=localStorage.getItem(META_KEY);
    if(m) Object.assign(meta,JSON.parse(m));
    else { const s=localStorage.getItem(STORE_KEY); // plan saved by an older (offline-only) version: treat as unsynced edits, so they're never lost silently
      if(s){ meta.dirty=true; meta.editedAt=Date.parse(JSON.parse(s).savedAt||"")||1; } } }catch(e){}
  const saveMeta=()=>{ try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){} };
  let state="saved", timer=null, chain=Promise.resolve(), lastChecked=0, deferred=false;
  const POLL_MS=window.__pollMs||30000;
  // she's in the middle of something: an open sheet/dialog, a drag (or long-press about to become one), or typing the title
  const busy=()=>!!$("#sheet")||!!drag||!!pending||document.body.classList.contains("dragging")||document.activeElement===$("#title");
  const queue=fn=>(chain=chain.then(fn,fn));
  const fmt=ms=>{ if(!ms) return ""; const d=new Date(ms), now=new Date(); const loc=lang==="th"?"th-TH-u-ca-gregory":"en-GB";
    const o=d.toDateString()===now.toDateString()?{hour:"2-digit",minute:"2-digit"}:{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"};
    return d.toLocaleString(loc,o); };
  function paint(){
    const el=$("#sync"); if(!el) return; el.dataset.s=state;
    $("#stxt").textContent=T({saved:"sSaved",saving:"sSaving",checking:"sChecking",offline:"sOffline"}[state]);
    const last=Math.max(meta.rev||0,meta.dirty?meta.editedAt:0);
    $("#stime").textContent=last?T("sLast")+" "+fmt(last):"";
    $("#sauto").textContent=T("sAuto")+(lastChecked?" · "+T("sChecked")+" "+new Date(lastChecked).toLocaleTimeString(lang==="th"?"th-TH-u-ca-gregory":"en-GB",{hour:"2-digit",minute:"2-digit"}):"");
    const f=$("#footVer"); if(f) f.textContent=T("verLbl")+": "+BUILD.label;
  }
  // content comparison that ignores ids, edit flags and save times
  const key=p=>JSON.stringify(p,(k,v)=>k==="id"||k==="ed"||k==="savedAt"?undefined:v);
  async function get(){
    const r=await fetch(url()+"?_="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    lastChecked=Date.now();
    const t=(await r.text()).trim(); if(!t) return null;
    const d=JSON.parse(t); if(!d||!d.plan) return null; return d;
  }
  async function put(){
    const rev=meta.dirty?meta.editedAt:(meta.rev||Date.now());
    const body=JSON.stringify({app:"china-trip-planner",rev,by:dev,plan});
    const r=await fetch(url(),{method:"POST",headers:{"content-type":"application/json"},body});
    if(!r.ok) throw new Error("HTTP "+r.status);
    if(meta.editedAt===rev||!meta.dirty){ meta.dirty=false; }
    meta.rev=rev; saveMeta();
  }
  function takeRemote(d,undoable){
    if(undoable) snapshot();
    plan=normalize(d.plan); save(); render();
    meta.rev=d.rev; meta.dirty=false; saveMeta();
  }
  // push local edits (debounced)
  function edited(){
    meta.dirty=true; meta.editedAt=Date.now(); saveMeta(); state="saving"; paint();
    clearTimeout(timer); timer=setTimeout(()=>pull("save"),2000);
  }
  async function pushNow(){
    clearTimeout(timer); if(!meta.dirty) { state="saved"; paint(); return true; }
    state="saving"; paint();
    try{ await put(); state=meta.dirty?"saving":"saved"; paint(); return true; }
    catch(e){ state="offline"; paint(); return false; }
  }
  // pull: mode "open" (quiet), "refresh" (always reports), "auto" (tab became visible)
  // mode: "refresh" (button, always reports), "open", "auto" (foreground/online), "poll" (timer), "save" (debounced autosave)
  function pull(mode){ return queue(async()=>{
    clearTimeout(timer);
    const quiet=mode!=="refresh";
    state=meta.dirty?"saving":"checking"; paint();
    let d;
    try{ d=await get(); }
    catch(e){ state="offline"; paint(); if(mode==="refresh") toast(T("tOffline")); return "offline"; }
    let res;
    if(!d){ // nothing shared yet: seed it with this device's plan
      meta.dirty=true; meta.editedAt=meta.editedAt||Date.now(); res=(await pushNow())?"seeded":"offline";
      if(mode==="refresh") toast(res==="offline"?T("tOffline"):T("tPushed"));
      return res;
    }
    const same=key(normalize(d.plan))===key(plan);
    if(same){ if(meta.dirty||meta.rev!==d.rev){ meta.dirty=false; meta.rev=d.rev; saveMeta(); } res="same"; }
    else if(meta.dirty&&d.rev===meta.rev){ // only this device changed since the last sync: save it (no conflict)
      res=(await pushNow())?"pushed":"offline"; if(mode==="refresh") toast(res==="offline"?T("tOffline"):T("tPushed"));
    }
    else { // the shared copy changed on the other phone
      if(quiet&&busy()){ deferred=true; state=meta.dirty?"saving":"saved"; paint(); return "deferred"; }
      deferred=false;
      if(meta.dirty){ state="saved"; paint(); res=await conflict(d); }
      else { takeRemote(d,true); res="taken"; toast(quiet?T("tPartner"):T("tGotLatest"),true); }
    }
    if(res==="same"&&mode==="refresh") toast(T("tUpToDate"));
    if(res==="same"||res==="taken") deferred=false;
    if(state==="checking"||(state==="saving"&&!meta.dirty)) state="saved";
    paint();
    return res;
  });}
  function conflict(d){ return new Promise(resolve=>{
    openSheet(`<h2>${esc(T("conflictH"))}</h2><p class="hint">${esc(T("conflictMsg")(fmt(d.rev)))}</p>
     <div class="actions"><button class="btn" data-keep type="button">${esc(T("keepMine"))}</button><button class="btn primary" data-latest type="button" style="flex:1">${esc(T("getLatest"))}</button></div>`,
     s=>{
       s.querySelector("[data-latest]").onclick=()=>{ closeSheet(); takeRemote(d,true); toast(T("tGotLatest"),true); resolve("taken"); };
       s.querySelector("[data-keep]").onclick=async()=>{ closeSheet(); meta.editedAt=Math.max(Date.now(),d.rev+1); saveMeta(); const ok=await pushNow(); toast(ok?T("tPushed"):T("tOffline")); resolve(ok?"pushed":"offline"); };
     });
  });}
  // newer app code on GitHub Pages? reload with a cache-busting query (keeps local plan + undo point)
  async function checkApp(){
    if(location.protocol==="file:") return false;
    try{
      const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"}); if(!r.ok) return false;
      const m=(await r.text()).match(/<meta name="app-build" content="([^"]+)"/);
      if(m&&m[1]!==BUILD.id){
        try{ sessionStorage.setItem(FLASH_KEY,JSON.stringify({msg:"tNewApp",undo:undoStack.length?undoStack[undoStack.length-1]:null})); }catch(e){}
        location.replace(location.pathname+"?v="+Date.now()+location.hash); return true;
      }
    }catch(e){}
    return false;
  }
  // auto-sync: GET every POLL_MS while visible; deferred checks retry once she's done editing/dragging
  let polls=0;
  function tick(){
    if(document.visibilityState!=="visible") return;
    if(busy()){ deferred=true; return; }
    polls++; pull("poll");
  }
  setInterval(tick,POLL_MS);
  setInterval(()=>{ if(deferred&&!busy()&&document.visibilityState==="visible"){ deferred=false; pull("poll"); } },1000);
  async function refresh(){
    const b=$("#bRefresh"); b.disabled=true;
    try{ const res=await pull("refresh"); if(res!=="offline") await checkApp(); }
    finally{ b.disabled=false; }
  }
  function boot(){
    try{ const f=JSON.parse(sessionStorage.getItem(FLASH_KEY)||"null"); sessionStorage.removeItem(FLASH_KEY);
      if(f){ if(f.undo){ undoStack.push(f.undo); $("#bUndo").disabled=false; } setTimeout(()=>toast(T(f.msg),!!f.undo),400); } }catch(e){}
    if(/[?&]v=\d/.test(location.search)) history.replaceState(null,"",location.pathname+location.hash);
    state=meta.dirty?"saving":"saved"; paint();
    window.addEventListener("online",()=>{ if(busy()) deferred=true; else pull("auto"); });
    document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(busy()) deferred=true; else pull("auto"); } });
    return pull("open");
  }
  return {edited,pull,refresh,boot,paint,pushNow,get id(){return id},get meta(){return meta},get state(){return state},get polls(){return polls},get deferred(){return deferred},POLL_MS,whenIdle:()=>chain};
})();
$("#bRefresh").onclick=()=>Sync.refresh();

/* ---------- boot ---------- */
async function boot(){
  plan=load(); render();
  const synced=Sync.boot();
  try{ if(!localStorage.getItem(HELP_KEY)) $("#firsthelp").hidden=false; }catch(e){}
  if(/#.*\b[zj]=/.test(location.hash)){
    await synced; // a shared link opened on purpose wins over the shared copy
    try{ const p=await decodePlan(location.hash); if(p){ replacePlan(p,T("tOpened")); } }
    catch(e){ toast(e.message||T("tOpenFail")); }
    window.history.replaceState(null,"",location.href.split("#")[0]);
  }
  window.__planner={get plan(){return plan},get lang(){return lang},setLang,tx,normalize,moveItem:(id,l,i)=>{snapshot();moveItem(id,l,i);commit();},deleteItem,nudge,encodePlan,decodePlan,shareLink,undo,STORE_KEY,Sync,BUILD,ready:true};
}
boot();
})();

</script>
