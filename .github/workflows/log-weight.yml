name: Log weight

# Phone path: open a "Log weight" issue (the form on the health page).
# Desktop path: Actions → Log weight → Run workflow.
# Only the repository owner is accepted. The job appends health/data/weight.csv
# and commits to main, which GitHub Pages publishes.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      kg:
        description: Weight in kilograms, for example 91.4
        required: true
        type: string
      date:
        description: Date YYYY-MM-DD. Leave blank for today in Singapore.
        required: false
        type: string

permissions: {}

concurrency:
  group: health-data
  cancel-in-progress: false

jobs:
  log:
    if: >-
      github.repository == 'keithorian/keithorian.github.io' &&
      github.actor == github.repository_owner &&
      (
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.issue.body, '### Weight (kg)')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update weight.csv
        id: log
        env:
          WEIGHT_KG: ${{ github.event.inputs.kg }}
          WEIGHT_DATE: ${{ github.event.inputs.date }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python health/scripts/log_weight.py

      - name: Commit weight
        if: steps.log.outputs.commit == 'true'
        env:
          COMMIT_MSG: ${{ steps.log.outputs.commit_message }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health/data/weight.csv
          if git diff --cached --quiet; then
            echo "Weight file unchanged"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Reply and close
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          MESSAGE: ${{ steps.log.outputs.message }}
        run: |
          set -euo pipefail
          gh issue comment "$NUMBER" --body "$MESSAGE"
          gh issue close "$NUMBER"

  reject:
    if: >-
      github.repository == 'keithorian/keithorian.github.io' &&
      github.event_name == 'issues' &&
      github.actor != github.repository_owner &&
      contains(github.event.issue.body, '### Weight (kg)')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close other people's weight issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$NUMBER" --body "Only the repository owner can log a weight here."
          gh issue close "$NUMBER"
